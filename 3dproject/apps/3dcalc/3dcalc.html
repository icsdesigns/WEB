/* ===== cajón de ahorro =====================================================
   Ingresos automáticos: cada pedido activo/finalizado aporta una tasa calculada
   sobre su total PREVIO a la tasa, según tipo de proyecto y tramo de importe.
   Gastos: se añaden a mano. El saldo es la suma de todos los movimientos. */
var CAJON_TASA={ 'Técnico':{bajo:0.05,alto:0.05}, 'Artístico':{bajo:0.15,alto:0.075} };
var CAJON_TRAMO=50;   // € que separan el tramo bajo del alto
function cajon(){ if(!S.cajon||typeof S.cajon!=='object')S.cajon={movs:[]}; if(!Array.isArray(S.cajon.movs))S.cajon.movs=[]; return S.cajon; }
/* Los pedidos sin diseño propio (niveles d0 «No necesario» y d1 «Búsqueda de modelos», aunque se
   renombren) pagan siempre el 5%, sea cual sea el tipo de proyecto y el importe. */
var CAJON_TASA_SIN_DISENO=0.05;
function cajonSinDiseno(dm){
  if(dm==null||dm==='')return false;
  var niv=(typeof disenoNivel==='function')?disenoNivel(dm):dm;
  return cajonSinDisenoNames().indexOf(niv)>=0;
}
function cajonRate(tipo,base,dm){
  if(cajonSinDiseno(dm))return CAJON_TASA_SIN_DISENO;
  return _cajonRateTipo(tipo,base);
}
function _cajonRateTipo(tipo,base){
  var tf=CAJON_TASA[tipo]||CAJON_TASA['Técnico'];
  return (num(base)<CAJON_TRAMO)?tf.bajo:tf.alto;
}
function cajonFee(tipo,base,dm){ return roundMoney(num(base)*cajonRate(tipo,base,dm)); }
function cajonSaldo(){ return roundSigned(cajon().movs.reduce(function(s,m){ return s+num(m.amount); },0)); }
function cajonMovOf(orderId){ return cajon().movs.filter(function(m){ return m.orderId===orderId; })[0]||null; }
/* Un pedido aporta al cajón si está activo o finalizado (aunque esté archivado). */
function cajonAplica(o){ if(!o)return false; var e=ordState(o); return e==='Activo'||e==='Finalizado'; }
function cajonSync(o){ if(!o)return; return withTar(ordTar(o),function(){ return _cajonSync(o); }); }
function _cajonSync(o){
  try{
    if(!o)return;
    /* Solo aportan los pedidos que llevan la tasa incluida en su precio, es decir,
       los guardados a partir de que existe el cajón. Los anteriores no se tocan. */
    if(!num(o.precio_base_cajon)){ if(cajonMovOf(o.id))cajonDropOrder(o.id,true); return; }
    var mv=cajonMovOf(o.id), aplica=cajonAplica(o);
    if(!aplica){ if(mv)cajonDropOrder(o.id,true); return; }
    var tipo=(o.tipo_proyecto||(o.prod&&o.prod.tipo)||'Técnico');
    var base=num(o.precio_base_cajon);
    var dm=o.diseno_modelado;
    var fee=cajonFee(tipo,base,dm);
    if(mv){ mv.amount=fee; mv.tipo=tipo; mv.base=base; mv.rate=cajonRate(tipo,base,dm); mv.ts=mv.ts||Date.now(); }
    else{
      cajon().movs.push({ id:'cj'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        kind:'in', orderId:o.id, label:'Tasa · '+(o.number||o.cliente||'pedido'), tipo:tipo,
        base:base, rate:cajonRate(tipo,base,dm), amount:fee, ts:Date.now() });
    }
    save();
  }catch(e){}
}
function cajonDropOrder(orderId,skipSave){
  var c=cajon(), before=c.movs.length;
  c.movs=c.movs.filter(function(m){ return m.orderId!==orderId; });
  if(c.movs.length!==before && !skipSave)save();
  if(c.movs.length!==before && skipSave)save();
}

/* Pone al día el cajón con todos los pedidos guardados (por ejemplo, los que ya
   estaban activos antes de existir el cajón, o si se editó un precio). */
function cajonReconcile(){
  try{
    var ch=false;
    (S.orders||[]).forEach(function(o){
      if(!o)return;
      var mv=cajonMovOf(o.id), aplica=cajonAplica(o)&&!!num(o.precio_base_cajon);
      if(aplica&&!mv){ cajonSync(o); ch=true; }
      else if(!aplica&&mv){ cajonDropOrder(o.id,true); ch=true; }
    });
    /* movimientos huérfanos: su pedido ya no existe */
    var ids={}; (S.orders||[]).forEach(function(o){ if(o)ids[o.id]=1; });
    var c=cajon(), n0=c.movs.length;
    c.movs=c.movs.filter(function(m){ return m.kind!=='in' || !m.orderId || ids[m.orderId]; });
    if(c.movs.length!==n0)ch=true;
    if(ch)save();
  }catch(e){}
}

function loadColorCatalog(force){

    .catch(function(){
      return fetch('../../../data/filamentos.json',{cache:'no-store'}).then(function(r){return r.json();})

          var out=[];

   la fila tocada y el resumen del campo, para que el desplegable no dé saltos ni
   pierda la posición del scroll mientras se eligen varios colores. */
function toggleColor(name,el){
  var c=CS(), sel=selectedColors(c), i=sel.indexOf(name), on=(i<0);

  if(row){
    row.classList.toggle('on',on);

  } else _rebuildColorField();

  var v=String((inp&&inp.value)||'').trim(); if(!v)return;

  var sel=selectedColors(CS());

  var txt=f.querySelector('.cfield-txt');
  if(txt){ txt.textContent=resumen; txt.classList.toggle('has',sel.length>0); }

  var resumen = sel.length===0 ? 'Sin color seleccionado'
              : (sel.length===1 ? '1 color seleccionado' : sel.length+' colores seleccionados');

  if(cat===null) lista='<div class="cpick-load">Cargando colores del catálogo…</div>';

    var grupos={};
    cat.forEach(function(x){
      var g=x.material||'Otros';

    lista=Object.keys(grupos).map(function(g){

              +'<i style="background:'+esc(x.hex)+'"></i><span>'+esc(x.nombre)+'</span></label>';
          }).join('');
    }).join('');
  }
  var cabecera = sel.length
    ? '<div class="cpick-top"><span>'+resumen+'</span><button type="button" class="cpick-clear" onclick="clearColors()">Desmarcar todos</button></div>'
    : '';
  return '<div class="cfield">'
    +'<button type="button" class="cfield-btn" onclick="colorPanelToggle()">'
      +'<span class="cfield-txt'+(sel.length?' has':'')+'">'+resumen+'</span><span class="cfield-car">▾</span></button>'
    +'<div class="cpick-panel'+(colorPanelOpen?' open':'')+'" id="colorPanel">'+cabecera+lista
      +'<div class="cpick-manual"><input class="inp" placeholder="…o escribe un color y pulsa Intro" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addManualColor(this);}"></div>'
    +'</div></div>';
}

/* ===== simulación del calendario (antes de aceptar el pedido) ================
   Programa una copia temporal del pedido junto a los ya guardados y devuelve la
   planificación resultante. Nunca toca S.orders, SCHED_INFO ni el calendario
   real: es solo una previsualización de «cómo quedaría si lo guardase ahora». */
var SIM_ID='__SIM__';
function _simSchedule(prod,dm,horas,urgLevel){
  if(!prod)return null;
  var _ul=(urgLevel==='Urgente'?'Urgente':'Normal');
  var pd=prodDays(prod,horas,dm,_ul==='Urgente');
  if(!pd||pd.total<=0)return null;
  var temp={id:SIM_ID,number:SIM_ID,tar_snap:tarCur(),cliente:((CS()&&CS().cliente)||'Este pedido'),created_at:new Date().toISOString(),archived:false,prod:prod,diseno_modelado:dm,horas:String(horas),urgencia_nivel:_ul,cal_at:_simCalAt()};
  var orig=S.orders, infoPrev=SCHED_INFO, sched, info;
  S.orders=_simBase().concat([temp]);
  try{ sched=scheduleOrders(); info=SCHED_INFO; }catch(e){ sched={}; info=null; }
  S.orders=orig; SCHED_INFO=infoPrev;

/* Cuántos pedidos ya programados se irían a una fecha peor por colar este. */
function _simImpact(res){
  var base, infoPrev=SCHED_INFO;
  try{ base=scheduleOrders(); }catch(e){ base={}; }
  SCHED_INFO=infoPrev;
  var n=0, worst=0;
  (S.orders||[]).forEach(function(o){
    var b=base[o.id], a=res.sched[o.id]; if(!b||!a)return;
    var fb=_entregaSched(b), fa=_entregaSched(a); if(!fb||!fa)return;
    var dd=Math.round((fa-fb)/86400000);
    if(dd>0){ n++; if(dd>worst)worst=dd; }

}

function _simCalGridHTML(res){

    sc.test.forEach(function(k){ (dayMap[k]=dayMap[k]||[]).push({o:o,ph:'t'}); });

function _finDate(res){ if(!res||!res.placed.length)return null; var last=res.placed[res.placed.length-1].dk; var d=_addD(_md(last),1); while(_isSun(d))d=_addD(d,1); return d; }

function _fitStandards(C,stds,sched,info,write){

    if(r&&ov>2){ C.w=snap.w; C.p=snap.p; var r2=_placeOrder(C,so,false,true); var ov2=_overDays(so,r2);

function scheduleOrders(){
  var list=(S.orders||[]).filter(function(o){return o&&o.prod&&ordLive(o)&&!o.cal_off;});
  function byCal(a,b){ return ((a.cal_at||toTs(a.created_at))||0)-((b.cal_at||toTs(b.created_at))||0); }
  var urgs=list.filter(function(o){return o.urgencia_nivel==='Urgente';}).sort(byCal);
  var stds=list.filter(function(o){return o.urgencia_nivel!=='Urgente';}).sort(byCal);
  var C={w:{},p:{}}, sched={}, info={compressed:[],delayed:{},overdue:[]};
  urgs.forEach(function(o){
    var base=_md((o.prod&&o.prod.startDay)||o.created_at||Date.now()); var tf=_md(Date.now()); if(base<tf)base=tf;
    var chosen=null, first=null;
    for(var shift=0; shift<40; shift++){
      var Ct=_cloneCaps(C);
      var r=_placeOrder(Ct,o,true,true,_dk(_addD(base,shift))); if(!r)continue;
      if(!first)first={C:Ct,r:r};
      var Cs=_cloneCaps(Ct);
      if(_fitStandards(Cs,stds,{},{compressed:[],delayed:{},overdue:[]},false)){ chosen={C:Ct,r:r}; break; }
    }
    var pick=chosen||first;
    if(pick){ C.w=pick.C.w; C.p=pick.C.p; _commitSched(sched,o,pick.r,false); if(!chosen)info.overdue.push({id:o.id,days:0,urgent:true}); }
  });
  _fitStandards(C,stds,sched,info,true);

}

  if(ch)save(); return ch; }

/* ===== estadísticas ===== */
var statF={from:'',to:''};
var _statCharts=[];
function statParse(s){ if(!s)return null; if(/^\d{4}-\d{2}-\d{2}$/.test(s)){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);} var d=new Date(s); return isNaN(d.getTime())?null:d; }
function statMonth(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function statSetFrom(v){statF.from=v;renderStats();}
function statSetTo(v){statF.to=v;renderStats();}
function statPreset(p){ var now=new Date(); if(p==='7'){var d=new Date(now);d.setDate(d.getDate()-6);statF.from=d.toISOString().slice(0,10);statF.to=now.toISOString().slice(0,10);} else if(p==='year'){statF.from=now.getFullYear()+'-01-01';statF.to=now.getFullYear()+'-12-31';} else {statF.from='';statF.to='';} renderStats(); }
function statDestroy(){ _statCharts.forEach(function(c){try{c.destroy();}catch(e){}}); _statCharts=[]; }
function renderStats(){
  statDestroy();
  var g=S.global_config, u=g.money_unit||'€';
  function f(n){return (Number(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+u;}
  var fromD=statParse(statF.from), toD=statParse(statF.to);
  function inRange(o){var d=statParse(o.fecha); if(!d)return true; if(fromD&&d<fromD)return false; if(toD&&d>toD)return false; return true;}
  var ACC=['Aceptado','En producción','Post-procesado','Listo para entregar','Entregado'];
  var os=S.orders.filter(inRange);
  var acc=os.filter(function(o){return ACC.indexOf(o.estado)>=0;});
  var facturado=acc.reduce(function(s,o){return s+num(o.precio_final);},0);
  var cobrado=acc.reduce(function(s,o){return s+num(o.importe_pagado);},0);
  var pendiente=acc.reduce(function(s,o){var d=num(o.precio_final)-num(o.importe_pagado);return s+(d>0?d:0);},0);
  var propinas=acc.reduce(function(s,o){var d=num(o.importe_pagado)-num(o.precio_final);return s+(d>0?d:0);},0);
  var beneficio=acc.reduce(function(s,o){return s+num(o.beneficio_neto);},0);
  var coste=acc.reduce(function(s,o){return s+num(o.coste_bruto);},0);
  var margen=facturado>0?beneficio/facturado*100:0;
  var pedidoMedio=acc.length?facturado/acc.length:0;
  var pesoTotal=os.reduce(function(s,o){return s+num(o.peso_g);},0);
  var horasTotal=os.reduce(function(s,o){return s+num(o.horas);},0);
  var elec=acc.reduce(function(s,o){var pr=S.printers.filter(function(p){return String(p.name||'').toLowerCase()===String(o.impresora||'').toLowerCase();})[0]; if(!pr)return s; return s+num(o.horas)*num(pr.energy_consumption_kwh)*num(g.energy_cost_kwh);},0);
  function topOf(key){var c={};os.forEach(function(o){var m=o[key]||'-';c[m]=(c[m]||0)+1;});var a=Object.keys(c).sort(function(x,y){return c[y]-c[x];});return a[0]||'-';}
  var topMat=topOf('filamento'), topPr=topOf('impresora');
  // current-month payment methods
  var nowM=statMonth(new Date()); var pmCur={};
  acc.forEach(function(o){var d=statParse(o.fecha); if(!d||statMonth(d)!==nowM)return; var m=o.payment_method||'Otro'; pmCur[m]=(pmCur[m]||0)+num(o.importe_pagado);});
  var pmList=Object.keys(pmCur).map(function(k){return [k,pmCur[k]];}).sort(function(a,b){return b[1]-a[1];});
  function kpi(lbl,val,clr){return '<div class="kpi" style="text-align:center"><div class="k-l" style="color:'+(clr||'var(--t2)')+'">'+lbl+'</div><div class="k-v" style="font-size:19px'+(clr?(';color:'+clr):'')+'">'+val+'</div></div>';}
  var kpis='<div class="kpis">'
    +kpi('Pedidos', acc.length+' <span style="font-size:12px;color:var(--t2)">/ '+os.length+'</span>')
    +kpi('Facturado', f(facturado), '#4D9FFF')
    +kpi('Cobrado', f(cobrado), '#34D399')
    +kpi('Pendiente', f(pendiente), '#F4B740')
    +kpi('Propinas', f(propinas), '#EC4899')
    +kpi('Coste', f(coste), '#FF6B6B')
    +kpi('Beneficio', f(beneficio), '#34D399')
    +kpi('Margen', margen.toFixed(1)+'%', '#B87CFF')
    +'</div>';
  var prodRows=[['Pedido medio',f(pedidoMedio)],['Electricidad',f(elec)],['Material top',esc(topMat)],['Impresora top',esc(topPr)],['Material usado',(pesoTotal/1000).toFixed(2)+' kg'],['Tiempo total',horasTotal.toFixed(1)+' h']]
    .map(function(r){return '<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--t2)">'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('');
  var pmRows=pmList.length?pmList.map(function(p){return '<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span>'+esc(p[0])+'</span><b style="color:#34D399">'+f(p[1])+'</b></div>';}).join(''):'<div class="empty" style="padding:16px">Sin ingresos este mes.</div>';
  document.getElementById('view').innerHTML=
    '<div class="h1">Estadísticas</div><div class="h-sub">Resumen financiero y de producción. Los importes financieros cuentan solo pedidos aceptados.</div>'
    +'<div class="ord-toolbar" style="flex-wrap:wrap;gap:8px"><span class="lbl" style="margin:0">Período</span>'
      +'<input class="inp" type="date" style="max-width:150px" value="'+esc(statF.from)+'" onchange="statSetFrom(this.value)">'
      +'<span style="color:var(--t3)">→</span>'
      +'<input class="inp" type="date" style="max-width:150px" value="'+esc(statF.to)+'" onchange="statSetTo(this.value)">'
      +'<button class="btn ghost" onclick="statPreset(\'7\')">7 días</button>'
      +'<button class="btn ghost" onclick="statPreset(\'year\')">Año</button>'
      +(statF.from||statF.to?'<button class="btn ghost" onclick="statPreset(\'\')">Limpiar</button>':'')
      +'<span class="sp"></span><button class="btn ghost" onclick="statCSV()">⬇ CSV</button></div>'
    +kpis
    +'<div class="chartbox"><div class="card-h">Evolución mensual</div><div style="height:300px"><canvas id="st-evo"></canvas></div></div>'
    +'<div class="grid2" style="grid-template-columns:1fr 1fr">'
      +'<div class="chartbox"><div class="card-h">Estado de pedidos</div><div style="height:280px"><canvas id="st-status"></canvas></div></div>'
      +'<div class="chartbox"><div class="card-h">Materiales utilizados</div><div style="height:280px"><canvas id="st-mat"></canvas></div></div>'
    +'</div>'
    +'<div class="chartbox"><div class="card-h">Ingresos por método de pago (mensual)</div><div style="height:300px"><canvas id="st-pay"></canvas></div></div>'
    +'<div class="grid2" style="grid-template-columns:1fr 1fr">'
      +'<div class="chartbox"><div class="card-h">Métodos de pago — mes actual</div>'+pmRows+'</div>'
      +'<div class="chartbox"><div class="card-h">Producción (todos los pedidos)</div>'+prodRows+'</div>'
    +'</div>';
  if(!(window.Chart)){ return; }
  var tick=(document.documentElement.getAttribute('data-theme')==='light')?'#5A6172':'#94a3b8';
  var grid=(document.documentElement.getAttribute('data-theme')==='light')?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';
  function mk(id,cfg){var el=document.getElementById(id); if(!el)return; _statCharts.push(new Chart(el.getContext('2d'),cfg));}
  // evolución
  var bk={}; acc.forEach(function(o){var d=statParse(o.fecha); if(!d)return; var k=statMonth(d); bk[k]=bk[k]||{f:0,c:0,b:0}; bk[k].f+=num(o.precio_final); bk[k].c+=num(o.coste_bruto); bk[k].b+=num(o.beneficio_neto);});
  var mk1=Object.keys(bk).sort();
  mk('st-evo',{type:'bar',data:{labels:mk1,datasets:[
    {label:'Facturado',data:mk1.map(function(k){return bk[k].f;}),backgroundColor:'rgba(96,165,250,.75)',borderColor:'#60a5fa',borderWidth:1,borderRadius:5},
    {label:'Coste',data:mk1.map(function(k){return bk[k].c;}),backgroundColor:'rgba(248,113,113,.72)',borderColor:'#f87171',borderWidth:1,borderRadius:5},
    {label:'Beneficio',data:mk1.map(function(k){return bk[k].b;}),backgroundColor:'rgba(52,211,153,.75)',borderColor:'#34d399',borderWidth:1,borderRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tick}}},scales:{x:{ticks:{color:tick},grid:{color:grid}},y:{beginAtZero:true,ticks:{color:tick},grid:{color:grid}}}}});
  // estado
  var sc={}; os.forEach(function(o){var s=o.estado||'Desconocido';sc[s]=(sc[s]||0)+1;});
  var se=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a];});
  var pal=['#34d399','#fbbf24','#60a5fa','#a78bfa','#9ca3af','#fb7185','#22d3ee'];
  mk('st-status',{type:'doughnut',data:{labels:se,datasets:[{data:se.map(function(k){return sc[k];}),backgroundColor:se.map(function(_,i){return pal[i%pal.length];}),borderColor:'transparent',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom',labels:{color:tick,usePointStyle:true,pointStyle:'circle',boxWidth:9,padding:10,font:{size:11}}}}}});
  // materiales
  var mc={}; os.forEach(function(o){var m=o.filamento||'Otro';mc[m]=(mc[m]||0)+1;});
  var me=Object.keys(mc).sort(function(a,b){return mc[b]-mc[a];}); var top=me.slice(0,6); var rest=me.slice(6).reduce(function(s,k){return s+mc[k];},0); var ml=top.map(function(k){return [k,mc[k]];}); if(rest>0)ml.push(['Otros',rest]);
  var pal2=['#60a5fa','#f472b6','#a78bfa','#fbbf24','#34d399','#fb923c','#22d3ee'];
  mk('st-mat',{type:'polarArea',data:{labels:ml.map(function(x){return x[0];}),datasets:[{data:ml.map(function(x){return x[1];}),backgroundColor:ml.map(function(_,i){return pal2[i%pal2.length];}),borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:tick,usePointStyle:true,pointStyle:'circle',boxWidth:9,padding:10,font:{size:11}}}},scales:{r:{ticks:{color:tick,backdropColor:'transparent'},grid:{color:grid}}}}});
  // métodos de pago por mes
  var methods=['Efectivo','Bizum','Transferencia','Manual','Otro'];
  var mm={}; acc.forEach(function(o){var d=statParse(o.fecha); if(!d)return; var k=statMonth(d); mm[k]=mm[k]||{}; var me2=o.payment_method||'Otro'; if(methods.indexOf(me2)<0)me2='Otro'; mm[k][me2]=(mm[k][me2]||0)+num(o.importe_pagado);});
  var mmK=Object.keys(mm).sort();
  var pcol={Efectivo:'#22c55e',Bizum:'#3b82f6',Transferencia:'#a855f7',Manual:'#fb923c',Otro:'#6b7280'};
  mk('st-pay',{type:'bar',data:{labels:mmK,datasets:methods.map(function(me3){return {label:me3,data:mmK.map(function(k){return (mm[k]&&mm[k][me3])||0;}),backgroundColor:pcol[me3],borderWidth:0,borderRadius:4};})}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tick}}},scales:{x:{stacked:true,ticks:{color:tick},grid:{color:grid}},y:{stacked:true,beginAtZero:true,ticks:{color:tick},grid:{color:grid}}}}});
}
function statCSV(){
  var fromD=statParse(statF.from), toD=statParse(statF.to);
  var os=S.orders.filter(function(o){var d=statParse(o.fecha); if(!d)return true; if(fromD&&d<fromD)return false; if(toD&&d>toD)return false; return true;});
  if(!os.length){toast3('No hay datos en el rango','#FF6B8A');return;}
  var head=['Nº','Fecha','Cliente','Estado','Material','Facturado','Coste','Beneficio','Pagado'];
  var rows=os.map(function(o){return [o.number||'',o.fecha||'',('"'+String(o.cliente||'').replace(/"/g,'""')+'"'),o.estado||'',o.filamento||'',num(o.precio_final).toFixed(2),num(o.coste_bruto).toFixed(2),num(o.beneficio_neto).toFixed(2),num(o.importe_pagado).toFixed(2)];});
  var csv=[head.join(',')].concat(rows.map(function(r){return r.join(',');})).join('\n');

/* ===== configuración (global + impresoras + materiales) ===== */
function setGC(f,v){ cfgBegin(); if(f!=='money_unit'&&f!=='brand_color'&&f!=='pdf_company'&&f!=='pdf_slogan'&&f!=='pdf_logo')v=num(v); S.global_config[f]=v; save(); }
function setPr(i,f,v){ cfgBegin(); if(f!=='name')v=num(v); S.printers[i][f]=v; save(); }
function setPrDef(i){ cfgBegin(); S.printers.forEach(function(p,j){ if(j===i)p.def=true; else delete p.def; }); save(); renderCfg(); }
/* Lista de empresas (Configuración): todos los cambios quedan pendientes hasta confirmar con la contraseña. */
function _empG(){ var g=S.global_config; if(!Array.isArray(g.empresas)||!g.empresas.length)g.empresas=empresasList(); if(!g.empresa_def||g.empresas.indexOf(g.empresa_def)<0)g.empresa_def=g.empresas[0]; return g; }
function addEmp(){ cfgBegin(); var g=_empG(), n=g.empresas.length+1, nm='Empresa '+n; while(g.empresas.indexOf(nm)>=0){ n++; nm='Empresa '+n; } g.empresas.push(nm); save(); renderCfg(); }
function setEmp(i,v){ var old=empresasList()[i]; if(old==null)return; v=String(v==null?'':v).trim();
  if(!v){ toast3('El nombre de la empresa no puede estar vacío','#FF6B8A'); renderCfg(); return; }
  if(v===old)return;
  if(empresasList().some(function(x,j){ return j!==i&&x===v; })){ toast3('Ya existe otra empresa con ese nombre','#FF6B8A'); renderCfg(); return; }
  cfgBegin(); var g=_empG(); g.empresas[i]=v; if(g.empresa_def===old)g.empresa_def=v; save(); renderCfg(); }
function setEmpDef(i){ cfgBegin(); var g=_empG(); if(g.empresas[i]==null)return; g.empresa_def=g.empresas[i]; save(); renderCfg(); }
function delEmp(i){ var g=_empG(); var nm=g.empresas[i]; if(nm==null)return;
  if(g.empresas.length<=1){ toast3('Debe quedar al menos una empresa','#FF6B8A'); return; }
  if(!confirm('¿Quitar la empresa «'+nm+'» de la lista? Los pedidos que ya la tienen conservan su nombre.'))return;
  cfgBegin(); g=_empG(); g.empresas.splice(i,1); if(g.empresa_def===nm)g.empresa_def=g.empresas[0]; save(); renderCfg(); }
function addPr(){ cfgBegin(); S.printers.push({name:'Impresora '+(S.printers.length+1),material_diameter_mm:1.75,price_eur:0,depreciation_time_h:3000,service_costs_life_eur:0,energy_consumption_kwh:0.1}); save(); renderCfg(); }
function delPr(i){ cfgBegin(); S.printers.splice(i,1); save(); renderCfg(); }
function setFt(i,f,v){ cfgBegin(); if(f!=='name')v=num(v); S.filament_types[i][f]=v; save(); }
function addFt(){ cfgBegin(); S.filament_types.push({name:'Material '+(S.filament_types.length+1),price_per_kg:20}); save(); renderCfg(); }
function delFt(i){ cfgBegin(); S.filament_types.splice(i,1); save(); renderCfg(); }
function resetCfg(){ if(!confirm('¿Restablecer la configuración a los valores del repositorio de referencia?'))return; cfgBegin(); var d=defData(); S.printers=d.printers; S.filament_types=d.filament_types; S.global_config=d.global_config; rebuildTarifas(); applyBrand(); save(); renderCfg(); }
function gcField(label,f,suf){ return '<div class="fg"><label class="lbl">'+label+'</label><div class="suffix"><input class="inp" type="number" step="0.01" value="'+esc(S.global_config[f])+'" oninput="setGC(\''+f+'\',this.value)"><span class="u">'+(suf||'')+'</span></div></div>'; }
var UTIL_DEFAULTS={simple:0.30,caja_m:1,caja_l:2,bolsa_s:0.15,bolsa_m:0.80,bolsa_l:1.50};
function utilPrice(k){ var up=(S.global_config&&S.global_config.util_prices)||{}; var v=up[k]; return (v==null||isNaN(Number(v)))?UTIL_DEFAULTS[k]:Number(v); }
function setUtilPrice(k,v){ cfgBegin(); if(!S.global_config.util_prices||typeof S.global_config.util_prices!=='object')S.global_config.util_prices=Object.assign({},UTIL_DEFAULTS); S.global_config.util_prices[k]=num(v); save(); _utilRefresh(); }
var UTIL_NAMES_DEF={g_simple:'Accesorios simples',g_caja:'Caja',g_bolsa:'Bolsa',simple:'Arandelas/NFC',caja_m:'Caja M',caja_l:'Caja L',bolsa_s:'Bolsa S',bolsa_m:'Bolsa M',bolsa_l:'Bolsa L'};
function utilName(k){ var un=(S.global_config&&S.global_config.util_names)||{}; return (un[k]!=null&&String(un[k]).trim()!=='')?String(un[k]):(UTIL_NAMES_DEF[k]||''); }
function setUtilName(k,v){ cfgBegin(); if(!S.global_config.util_names||typeof S.global_config.util_names!=='object')S.global_config.util_names={}; S.global_config.util_names[k]=v; save(); _utilRefresh(); }
/* Los utilitarios de la calculadora (nombres, títulos y precios) se leen en vivo de
   Configuración; esto refresca al vuelo lo que ya esté pintado en pantalla. */
function _utilRefresh(){ try{
  if(view==='calc'){ renderCalc(); return; }
  var box=document.querySelector('.card .ut-row'); if(box){ try{ renderCalc(); }catch(e){} }
  if(typeof _epId!=='undefined' && _epId){ try{ _rerenderEP(); }catch(e){} }
}catch(e){} }
/* Fila de componente: nombre + precio, en una sola línea. */
function gcUtilRow(k){ return '<div class="ut-cfg-row"><input class="inp" value="'+esc(utilName(k))+'" oninput="setUtilName(\''+k+'\',this.value)" placeholder="Nombre del utilitario" aria-label="Nombre"><div class="suffix"><input class="inp" type="number" step="0.01" min="0" value="'+esc(utilPrice(k))+'" oninput="setUtilPrice(\''+k+'\',this.value)" aria-label="Precio"><span class="u">€/ud</span></div></div>'; }
/* Grupo: el título (editable) encabeza sus componentes. */

function tarSet(kind,id,field,v,el){ if(!cfgCanEdit())return; var lv=tarLevels(kind).filter(function(x){ return x.id===id; })[0]; if(!lv)return;
  if(field==='name'){ v=String(v==null?'':v).trim();
    if(!v){ toast3('El nombre no puede estar vacío','#FF6B8A'); if(el)el.value=lv.name; return; }
    if(v===lv.name)return;
    var clash=tarLevels(kind).some(function(x){ return x.id!==id&&(x.name===v||x.aliases.indexOf(v)>=0); })||(kind==='dis'?DISENO_LEGACY.hasOwnProperty(v):(POSTPROCESADO_LEGACY.hasOwnProperty(v)||_MIG_POST.hasOwnProperty(v)));
    if(clash){ toast3('Ya existe otra tarifa con ese nombre','#FF6B8A'); if(el)el.value=lv.name; return; }
    cfgBegin(); var o=_tarOv(kind,id), old=lv.name; o.name=v;
    o.aliases=(o.aliases||[]).filter(function(a){ return a!==v; }); if(o.aliases.indexOf(old)<0&&old!==_tarBase(kind,id).name)o.aliases.push(old);
    if(kind==='dis'){ tplRemapDis(old,v); try{ _tplScn=null; }catch(e){} }

function saveProduct(id){
  var name=document.getElementById('pf_name').value.trim(); if(!name){ alert('El nombre es obligatorio'); return; }

  save(); closeModal(); renderCatalog(); toast3(id?'Producto actualizado':'Producto añadido','#34D399');
}
function delProduct(id){ var p=getProduct(id); if(!p)return; if(!confirm('¿Eliminar «'+p.name+'» del catálogo?'))return; S.catalog=catalog().filter(function(x){return x.id!==id;}); save(); renderCatalog(); toast3('Producto eliminado','#FF6B8A'); }
function dupProduct(id){ var p=getProduct(id); if(!p)return; var c=normProd(JSON.parse(JSON.stringify(p))); c.id=uid(); c.name=p.name+' (copia)'; catalog().unshift(c); save(); renderCatalog(); toast3('Producto duplicado','#34D399'); }
function renderCatalog(){
  var all=catalog().map(normProd);

    return '<tr><td class="c-prod"><div class="cat-nm">'+esc(p.name)+'</div>'+(p.desc?'<div class="cat-ds">'+esc(p.desc)+'</div>':'')+'</td>'
     +'<td class="c-med"><div class="cat-md">'+esc(p.medidas||'—')+'</div></td>'
     +'<td class="c-pre"><div class="cat-pr">'+(num(p.precio)>0?eur(p.precio):'—')+'</div></td>'
     +'<td class="c-act cat-act"><button class="del" title="Editar" onclick="editProductById(\''+p.id+'\')">✎</button> <button class="del" title="Duplicar" onclick="dupProduct(\''+p.id+'\')">⧉</button> <button class="del" title="Eliminar" onclick="delProduct(\''+p.id+'\')">✕</button></td></tr>';
  }).join('');

   : '<div class="empty">'+(catQ?'Ningún producto coincide con la búsqueda.':'Aún no hay productos en el catálogo. Añade el primero con «＋ Nuevo producto».')+'</div>';
  document.getElementById('view').innerHTML=
   '<div class="h1">Catálogo</div><div class="h-sub">Tus productos con sus medidas y precio estimado de referencia.</div>'
   +'<div class="ord-toolbar"><input class="inp ord-search" placeholder="Buscar producto…" value="'+esc(catQ)+'" oninput="catSearch(this.value)"><span class="sp"></span><button class="btn" onclick="newProduct()">＋ Nuevo producto</button></div>'
   +'<div class="card">'+body+'</div>';
}

/* ===== paneles plegables ====================================================
   foldHTML(clave,título,contador,contenido,clase): tarjeta con cabecera pulsable.
   Todos nacen PLEGADOS; el estado se recuerda mientras dure la sesión (_fold). */
var _fold={};
function foldHTML(key,title,count,inner,cls){ var open=!!_fold[key];
  return '<div class="card fold'+(open?' open':'')+(cls?' '+cls:'')+'" id="fold_'+key+'"><button type="button" class="fold-h" aria-expanded="'+(open?'true':'false')+'" onclick="foldToggle(\''+key+'\')"><span class="fold-car">▸</span><span class="fold-t">'+title+'</span>'+(count!=null&&count!==''?'<span class="fold-n">'+count+'</span>':'')+'</button><div class="fold-b">'+inner+'</div></div>'; }
function foldToggle(k){ _fold[k]=!_fold[k]; var el=document.getElementById('fold_'+k); if(el){ el.classList.toggle('open',!!_fold[k]); var b=el.querySelector('.fold-h'); if(b)b.setAttribute('aria-expanded',_fold[k]?'true':'false'); } }

function toast3(msg,clr){ var t=document.getElementById('toast3'); if(!t){t=document.createElement('div');t.id='toast3';document.body.appendChild(t);} t.textContent=msg; t.style.borderColor=(clr||'var(--ac)'); t.style.color=(clr||'var(--ac)'); t.classList.add('show'); clearTimeout(toast3._t); toast3._t=setTimeout(function(){t.classList.remove('show');},2800); }
function fmtD(iso){ if(!iso)return''; try{return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return'';} }
function pmContrast(hex){ try{var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (r*299+g*587+b*114)/1000>145?'#1a1a1a':'#fff';}catch(e){return '#fff';} }

function reclassifySel(est){ if(!est)return; var ids=S.orders.filter(function(o){return billingSel[o.id];}).map(function(o){return o.id;});

function setOrdField(id,f,v){ var o=getOrder(id); if(!o)return; if(['precio_final','importe_pagado','peso_g','horas','cantidad','gasto_misc'].indexOf(f)>=0)v=num(v); o[f]=v; if(f==='importe_pagado'||f==='precio_final')autoArchive(o); save(); updateOrdBadge(); }
function setOrderEstado(id,estado){ var o=getOrder(id); if(!o)return; o.estado=estado; o.status_updated_at=Date.now(); o.notif_snooze_until=0; save(); updateOrdBadge(); trackerLink(o); cajonSync(o); }
/* Mantiene el pedido de 3DTracker alineado con 3DCalc: pendiente/activo/finalizado lo crean o actualizan; rechazado lo quita. */
function trackerLink(o){ try{ if(!o)return;
  if(ordState(o)==='Rechazado'){ trackerRemove(o); return; }
  if(!o.tracked){ trackerEnsure(o).catch(function(){}); return; }
  syncTracker(o); }catch(e){} }
function trackerRemove(o){ var code=o&&(o.order_code||o.number);
  if(!o||!o.tracked||!code||!(window.DPCloud&&window.DPCloud.deleteOrder))return;
  syncTracker(o); /* marca calc_status:'rechazado' (el dashboard lo oculta aunque el borrado falle) */
  var id=o.id;
  window.DPCloud.deleteOrder(code).then(function(){ var c=getOrder(id)||o; c.tracked=false; c.tracker_activated_at=null; save();
    if(ordState(c)!=='Rechazado') trackerLink(c); /* se reclasificó mientras se borraba: se recrea */ }).catch(function(){}); }
/* ── Sincronización con 3DTracker ────────────────────────────────────────────
   Los pedidos con seguimiento activado (o.tracked) replican su clasificación
   de 3DCalc en 3DTracker: activo / finalizado / archivado. */
function trackerStateOf(o){
  if(!o)return null;
  if(o.archived)return 'archivado';
  var e=ordState(o);
  if(e==='Finalizado')return 'finalizado';
  if(e==='Rechazado')return 'rechazado';
  if(e==='Activo')return 'activo';
  return 'pendiente';
}
function syncTracker(o){
  try{
    if(!o||!o.tracked)return;
    var code=o.order_code||o.number; if(!code)return;
    if(!(window.DPCloud&&window.DPCloud.updateOrder))return;
    var st=trackerStateOf(o);
    var campos={ calc_status:st, calc_synced_at:Date.now(), archived:!!o.archived };
    if(st==='activo'&&!o.tracker_activated_at){ o.tracker_activated_at=Date.now(); campos.activated_at=new Date().toISOString(); }
    if(st==='archivado'){ campos.archived_at=(o.archived_at||Date.now()); }
    window.DPCloud.updateOrder(code,campos).catch(function(){});
  }catch(e){}
}
/* Los pedidos archivados pierden el seguimiento a los 3 meses de archivarse. */
function purgeOldTracking(){
  try{
    if(!(window.DPCloud&&window.DPCloud.deleteOrder))return;
    var LIM=90*24*60*60*1000, ahora=Date.now(), ch=false;
    (S.orders||[]).forEach(function(o){
      if(!o||!o.tracked||!o.archived||!o.archived_at)return;
      if((ahora-num(o.archived_at))<LIM)return;
      var code=o.order_code||o.number; if(!code)return;
      window.DPCloud.deleteOrder(code).catch(function(){});
      o.tracked=false; o.tracker_purged_at=ahora; ch=true;
    });
    if(ch)save();
  }catch(e){}
}
/* Crea el pedido en 3DTracker si aún no existe (queda pendiente de personalizar) y lo vincula. */
function trackerEnsure(o){
  var code=o&&(o.order_code||o.number);
  if(!code||!(window.DPCloud&&window.DPCloud.createOrder))return Promise.reject(new Error('sin 3DTracker'));
  function mk(){ return window.DPCloud.createOrder({order_code:code,customer_name:o.cliente||'',customer_email:o.cliente_email||'',description:o.descripcion||''}); }
  /* Todo dentro de la cadena de promesas: un fallo (p. ej. sin permiso, como un invitado) siempre llega como rechazo. */
  return Promise.resolve().then(function(){ return window.DPCloud.getOrderByCode?window.DPCloud.getOrderByCode(code):null; })
    .then(function(ex){ return ex?null:mk(); }).then(function(){ o.tracked=true; syncTracker(o); save(); });
}
/* Lleva a la configuración del pedido en 3DTracker (sin cambiar su estado); si aún no existe allí, lo crea. */
function openInTracker(id){ var o=getOrder(id); if(!o)return; if(ordState(o)==='Rechazado'){ toast3('Los pedidos rechazados no están en 3DTracker','#FF6B8A'); return; } var code=o.order_code||o.number;
  function nav(){ try{ window.parent.postMessage({__dp3:true,type:'openTrackerOrder',code:code},'*'); }catch(e){} closeModal(); }
  if(o.tracked){ nav(); return; }
  toast3('Creando el pedido en 3DTracker\u2026','#4D9FFF');
  trackerEnsure(o).then(nav,function(){ toast3('3DTracker no disponible ahora','#FF6B8A'); }); }
function openOrder(id){ var o=getOrder(id); if(!o)return; EDIT=null; if(o.web_nuevo){ o.web_nuevo=false; save(); } ordShow(o); }
/* Pinta la ventana del pedido. La copia de trabajo (EDIT) se crea al abrirla y se conserva mientras siga abierta. */
function ordShow(o){ if(!ED()||EDIT.id!==o.id)EDIT=ordEditInit(o); EDIT.pend=true; try{ openModal(orderModalHTML(o),'od-wide'); }finally{ if(EDIT)EDIT.pend=false; } }
function reopenOrder(id){ var o=getOrder(id); if(!o){ renderOrders(); return; }
  var m=document.getElementById('modal'), box=m?m.querySelector('.modal'):null;
  var scr=box?box.scrollTop:0;
  /* Al volver del asistente de riesgo se recupera la posición que tenía la ventana del pedido. */
  if(EDIT&&EDIT.scr!=null&&box&&box.className.indexOf('od-wide')<0)scr=EDIT.scr;
  if(EDIT)EDIT.scr=null;
  /* Se anota qué campo estaba enfocado (por su posición) y dónde tenía el cursor,
     para devolvérselo tras repintar: editar un valor no debe mover la vista. */
  var act=document.activeElement, idx=null, selA=null, selB=null;
  if(act&&box&&box.contains(act)){
    var campos=box.querySelectorAll('input,select,textarea');
    for(var i=0;i<campos.length;i++){ if(campos[i]===act){ idx=i; break; } }
    try{ selA=act.selectionStart; selB=act.selectionEnd; }catch(e){}
  }
  ordShow(o);
  var box2=(document.getElementById('modal')||{}).querySelector?document.getElementById('modal').querySelector('.modal'):null;
  if(box2){
    box2.scrollTop=scr;
    if(idx!=null){
      var c2=box2.querySelectorAll('input,select,textarea');
      if(c2[idx]){ try{ c2[idx].focus({preventScroll:true}); }catch(e){ try{ c2[idx].focus(); }catch(e2){} }
        if(selA!=null){ try{ c2[idx].setSelectionRange(selA,selB); }catch(e){} } }
    }
  }
  if(view==='ord')renderOrders(); }
/* Recalcula un pedido guardado de arriba abajo tras tocar un parámetro de cálculo.
   Hay que invalidar precio_normal/precio_urgente antes de llamar a orderDual(),
   porque si están puestos (pedidos «Ambos») devuelve los precios cacheados; y hay
   que refrescar precio_base_cajon, que es la base de la tasa de ahorro. */
function recalcOrder(o){
  if(!o)return null;
  o.precio_normal=null; o.precio_urgente=null;
  var r=compute(orderToCalcState(o));
  o.precio_base_cajon=roundMoney(r.cajonBase||0);
  var amb=(o.urgencia_nivel==='Ambos'), urgente=(o.urgencia_nivel==='Urgente');
  var d=orderDual(o);
  o.precio_final=((amb||urgente)?d.urgente:r.precio);
  o.precio_normal=(amb?d.normal:null);
  o.precio_urgente=(amb?d.urgente:null);
  o.urg_days=((amb||urgente)?(d.days!=null?d.days:o.urg_days):null);
  o.coste_bruto=roundMoney(r.bruto);
  o.beneficio_neto=roundMoney(r.beneficioTotal);
  return r;
}
/* ── Ventana de un pedido ─────────────────────────────────────────────────────
   Mismo formato que la Calculadora: a la izquierda los bloques del formulario
   (información, parámetros, utilitarios, tiempo de producción) y a la derecha el
   resultado con su desglose. Cada cambio se guarda al instante en el pedido. */
function ordEditInit(o){
  function cl(v){ return JSON.parse(JSON.stringify(v)); }
  var c={
    empresa:o.empresa||empresaDef(), cliente:o.cliente||'', cliente_email:o.cliente_email||'',
    tipo_proyecto:(o.tipo_proyecto||(o.prod&&o.prod.tipo)||'Técnico'),
    fecha:(o.fecha||(o.created_at?String(o.created_at).slice(0,10):todayISO())), descripcion:o.descripcion||'',
    impresora:o.impresora||'', filamento_tipo:o.filamento||'', filamento_color:o.filamento_color||'',
    is_multimaterial:!!o.is_multimaterial, material_breakdown:cl(Array.isArray(o.material_breakdown)?o.material_breakdown:[]),
    peso_g:String(num(ordBase(o).peso)), tiempo_h:String(num(ordBase(o).horas)), time_min:false, cantidad:(num(o.cantidad)||1), cant_modo:cantModo(o),
    diseno_modelado:o.diseno_modelado||'No necesario', diseno_opt:!!o.diseno_opt,
    busqueda_modelos:o.busqueda_modelos||'No', eliminacion_soportes:o.eliminacion_soportes||'No',
    postprocesado:o.postprocesado||'Limpio (pocos soportes sin lijado)', postproc_modo:o.postproc_modo||'Total',
    probabilidad_error:o.probabilidad_error||'Baja (25%)', markup:o.markup||'Normal (230%)',
    urgencia_nivel:o.urgencia_nivel||'Normal', gasto_misc:num(o.gasto_misc), util:cl(o.util||{}),
    prod_on:!!o.prod, prod:o.prod?cl(o.prod):null,
    _tar:ordTar(o)   /* tarifas del propio pedido: compute()/formulario las usan mientras la ventana esté abierta */
  };
  /* Se normaliza como lo hará el formulario al pintarse (utilitarios completos, tipo de la
     producción = tipo de proyecto) ANTES de tomar la referencia: si no, el primer cambio de
     cualquier campo (p. ej. la descripción) se tomaría también como cambio de utilitarios o
     producción y recalcularía el precio del pedido sin que el usuario tocase nada de cálculo. */
  ensureUtil(c); if(c.prod){ if(!Array.isArray(c.prod.tests))c.prod.tests=[]; c.prod.tipo=c.tipo_proyecto; }
  return {id:o.id, c:c, prev:cl(c), rt:null, pend:false};
}
/* Campos del formulario que se vuelcan al pedido. Solo se escribe lo que el usuario ha tocado,
   para no alterar valores antiguos del pedido que la ventana no muestra tal cual. */
var ORD_KEYS=['empresa','fecha','cliente','cliente_email','descripcion','tipo_proyecto','impresora','filamento_tipo','filamento_color','material_breakdown','peso_g','tiempo_h','cantidad','cant_modo','diseno_modelado','diseno_opt','postprocesado','postproc_modo','probabilidad_error','urgencia_nivel','gasto_misc','util','prod_on','prod'];
/* Los que cambian el precio: al tocarlos el pedido se recalcula igual que antes (recalcOrder). */
var ORD_PRICE_KEYS=['impresora','filamento_tipo','material_breakdown','peso_g','tiempo_h','cantidad','cant_modo','diseno_modelado','diseno_opt','postprocesado','postproc_modo','probabilidad_error','urgencia_nivel','gasto_misc','util','tipo_proyecto'];
function ordApply(){
  var E=ED(); if(!E)return; var o=getOrder(E.id); if(!o)return;
  var c=E.c, p=E.prev, ch={}, n=0;
  ORD_KEYS.forEach(function(k){ if(JSON.stringify(c[k])!==JSON.stringify(p[k])){ ch[k]=true; n++; } });
  if(!n)return;
  ['empresa','fecha','cliente','cliente_email','descripcion','tipo_proyecto','impresora','diseno_modelado','postprocesado','postproc_modo','probabilidad_error','urgencia_nivel'].forEach(function(k){ if(ch[k])o[k]=c[k]; });
  if(ch.diseno_opt)o.diseno_opt=!!c.diseno_opt;
  if(ch.filamento_tipo)o.filamento=c.filamento_tipo;
  if(ch.filamento_color)o.filamento_color=c.filamento_color;
  if(ch.cantidad)o.cantidad=Math.max(1,Math.floor(num(c.cantidad)||1));
  /* Peso y tiempo del pedido = totales efectivos (en modo multiplicador, la unidad × N). */
  if(ch.peso_g||ch.tiempo_h||ch.cantidad||ch.cant_modo){ var rk=compute(c); o.cant_modo=cantModo(c);
    o.peso_base_g=(rk.K>1?String(round4(rk.peso/rk.K)):null); o.horas_base=(rk.K>1?String(round4(rk.horas/rk.K)):null);
    if(ch.peso_g||ch.cantidad||ch.cant_modo)o.peso_g=String(rk.peso);
    if(ch.tiempo_h||ch.cantidad||ch.cant_modo)o.horas=String(rk.horas); }
  if(ch.gasto_misc)o.gasto_misc=num(c.gasto_misc);
  if(ch.util)o.util=JSON.parse(JSON.stringify(c.util||{}));
  if(ch.material_breakdown){
    o.material_breakdown=JSON.parse(JSON.stringify(c.material_breakdown||[]));
    /* En multimaterial el pedido guarda el resumen calculado, igual que al guardarlo desde la Calculadora. */
    if(c.is_multimaterial){ var rm=compute(c); o.filamento=rm.filName; o.filamento_color=rm.filColor; o.peso_g=String(rm.peso); }
  }
  /* El tipo de la producción sigue al tipo de proyecto (como al guardar desde la Calculadora). */
  if(ch.tipo_proyecto&&c.prod){ c.prod.tipo=c.tipo_proyecto; if(c.prod_on&&o.prod)ch.prod=true; }
  if(ch.prod_on||ch.prod){
    if(c.prod_on){
      var np=JSON.parse(JSON.stringify(c.prod||{tipo:'Técnico',diseno:'Nulo',tests:[],printh:''})); np.tipo=(c.tipo_proyecto||np.tipo||'Técnico');
      var was=!!o.prod; o.prod=np;
      if(!was){ o.cal_off=false; o.cal_at=Date.now(); o.promised=null; }   /* igual que «programar el tiempo» desde la lista */
    } else o.prod=null;
  }
  /* La referencia interna de la modalidad anterior se reinicia ANTES de recalcular: si no, al pasar de Urgente a Ambos la promesa
     urgente comprimiría la programación estándar y los días ganados (urg_days) no coincidirían con el calendario. */
  if(ch.urgencia_nivel&&o.prod)o.promised=null;
  var dual=(o.urgencia_nivel==='Ambos'||o.urgencia_nivel==='Urgente');

function _dataCardPrep(doc,w,rows){
  var pad=7, colW=w/2-pad-7, labH=5, lineH=4.6, gap=4.2, MAXL=14;
  var prep=(rows||[]).map(function(rw){
    var cells=[], maxL=1;
    for(var ci=0;ci<2;ci++){
      var lab=rw[ci*2], val=rw[ci*2+1];
      if(lab==null){ cells.push(null); continue; }

      var lines=doc.splitTextToSize(vs,colW);

      if(lines.length>MAXL){ lines=lines.slice(0,MAXL); lines[MAXL-1]=lines[MAXL-1]+'…'; }
      if(lines.length>maxL)maxL=lines.length;
      cells.push({lab:lab,lines:lines,url:isLink?val.url:null});
    }
    return {cells:cells,h:labH+maxL*lineH+gap};
  });

  prep.forEach(function(r){ total+=r.h; });

  doc.roundedRect(x,y,w,h,2.5,2.5,'FD');

  m.prep.forEach(function(rw){

/* Nombre del PDF: fecha(aaaammdd)_Cliente|Interno_Nombre cliente_Descripción.
   La fecha va en orden año-mes-día sin separadores porque «/» no es un carácter
   válido en un nombre de archivo. */
function pdfFileBase(o,kind){
  var f=String((o&&o.fecha)||todayISO()).slice(0,10).replace(/-/g,'');
  if(!/^[0-9]{8}$/.test(f))f=todayISO().replace(/-/g,'');
  var tipo=(kind==='empresa')?'Interno':(kind==='ambos'?'Cliente e Interno':'Cliente');
  var cli=String((o&&o.cliente)||'').trim(), desc=String((o&&o.descripcion)||'').trim();
  var parts=[f,tipo]; if(cli)parts.push(cli); if(desc)parts.push(desc);
  var name=parts.join('_').replace(/[\\\/:*?"<>|\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
  return name||f;

/* Abrir un PDF en una pestana nueva con el MISMO nombre que tendria al descargarlo.
   Un blob: no admite nombre de archivo, asi que se envuelve en una pagina cuyo
   <title> es ese nombre; ademas el propio PDF lleva el nombre en sus propiedades. */
function _pdfOpenNamed(blob,name){
  var url=URL.createObjectURL(blob);
  var w=null; try{ w=window.open("","_blank"); }catch(e){}
  if(!w){ try{ w=window.open(url,"_blank"); }catch(e){} 
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },60000); return w; }
  try{
    w.document.open();
    /* Las etiquetas de cierre de esta cadena van escapadas con barra invertida para
       que ninguna herramienta que inyecta código buscando el primer cierre de BODY
       del archivo (Live Server, por ejemplo) lo confunda con el final de ESTA página
       y parta el script. En JavaScript la barra invertida ahí no cambia nada. */
    w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+_pdfTitleEsc(name)+'<\/title>'
      +'<style>html,body{margin:0;height:100%;background:#525659}iframe{border:0;width:100%;height:100%;display:block}<\/style>'
      +'<\/head><body><iframe src="'+url+'" title="'+_pdfTitleEsc(name)+'"><\/iframe><\/body><\/html>');
    w.document.close();
    try{ w.document.title=name; }catch(e){}
  }catch(e){ try{ w.location.href=url; }catch(_e){} }
  setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },60000);
  return w;
}

/* ===== Solicitudes web («Solicitar presupuesto» de la web → pedido autoguardado) ===================
   La web guarda cada solicitud en Firestore, colección «pedidos_web» (id = localizador sin «#»,
   p. ej. S3D-L0S98L), con importado:false. 3DCalc las escucha con la sesión de Iván (solo con
   sesión real y datos ya cargados: un invitado NO escucha) y por cada una crea un pedido
   «Pendiente» como si lo hubiese guardado desde la Calculadora (mismo cálculo, mismas tarifas VIVAS
   en tar_snap), lo crea también en 3DTracker y, SOLO cuando el estado ya está guardado en la nube,
   marca el documento como importado:true. Si algo falla, el documento queda sin importar y se
   reintenta (cada WEB_RETRY_MS y en cada reconexión).
   · Sin duplicados: el pedido lleva web_localizador y un id y un número DETERMINISTAS a partir del
     localizador, así que varias pestañas/dispositivos a la vez, o una reconexión, dan el mismo pedido.
   · Contacto: la web envía «contacto» (teléfono); 3DCalc lo guarda en cliente_email, que es el campo
     «Información de contacto» (teléfono, email o lo que se prefiera). Si algún día llega cliente_email
     real y no hay contacto, se usa ese.
   · Número de pedido: «3DP-» + los 6 caracteres del localizador (S3D-L0S98L → 3DP-L0S98L). Así es único,
     reconocible (el mismo sufijo que ve el cliente) y válido como código de seguimiento: el portal del
     cliente y 3DTracker solo aceptan códigos 3DP-… (el número del pedido ES el código de 3DTracker).
     El localizador original se guarda en web_localizador y se puede buscar en Pedidos.
   · Revisión manual (web_revisar): falta peso/tiempo (sin tasadora), no hay precio al momento para el
     cliente, el nivel de post-procesado o el filamento no se reconocen, o el precio de 3DCalc difiere en

      +(_wNil(tas.modificadores)?'':_wRow('Modificadores',_wV(tas.modificadores)))+(_wNil(tas.ajustes)?'':_wRow('Ajustes',_wV(tas.ajustes),true))
      +_wExtras(tas,['archivo','archivos','gramos','gramosExactos','segundos','tiempo','medidas','modo','camas','colores','zonasSoporte','revision','motivoRevision','mallaNoValida','modificadores','ajustes','laminado','detalle'])+'</div>'
      +(lamH?('<div class="odw-sub">Laminado</div>'+lamH):''),'w');
  } else cTas=_wCard('Tasadora','<div class="odw-none">Sin estimación de la tasadora: hay que valorar el pedido a mano.</div>','w');
  /* --- detalle por archivo / cama --- */
  var det=tas&&Array.isArray(tas.detalle)?tas.detalle.filter(function(x){ return x!=null; }):[], cDet='';
  if(det.length){
    var KN=['nombre','medidas','gramos','segundos','soportes','zonas'];
    var otros=det.some(function(d){ var q=_wObj(d); return q&&Object.keys(q).some(function(k){ return KN.indexOf(k)<0; }); });
    var cell=function(l,h){ return '<td data-l="'+l+'">'+h+'</td>'; };
    cDet=_wCard('Detalle por archivo / cama','<div class="odw-tw"><table class="odw-tb"><thead><tr><th>Nombre</th><th>Medidas</th><th>Peso</th><th>Tiempo</th><th>Soportes</th><th>Zonas</th>'+(otros?'<th>Otros</th>':'')+'</tr></thead><tbody>'
      +det.map(function(d){ var q=_wObj(d); if(!q)return '<tr><td data-l="Nombre" colspan="'+(otros?7:6)+'">'+_wV(d)+'</td></tr>';
        var ex=Object.keys(q).filter(function(k){ return KN.indexOf(k)<0; }).map(function(k){ return _wKey(k)+': '+_wInline(q[k]); }).join(' · ');
        return '<tr>'+cell('Nombre',_wV(q.nombre))+cell('Medidas',_wNil(q.medidas)?_W_NIL:esc(_wMed(q.medidas)))
          +cell('Peso',_wFin(q.gramos)?esc(_wNum(q.gramos,1)+' g'):_W_NIL)
          +cell('Tiempo',_wFin(q.segundos)?esc(_wHM(q.segundos)):_W_NIL)
          +cell('Soportes',_wNil(q.soportes)?_W_NIL:esc(_wSop(q.soportes)))+cell('Zonas',_wV(q.zonas))+(otros?cell('Otros',ex?esc(ex):_W_NIL):'')+'</tr>'; }).join('')+'</tbody></table></div>','w');
  }
  /* --- claves que no se conocen + volcado completo --- */
  var KT=['cliente','proyecto','plazo','archivos','colores','tasadora'], ext='';
  if(F){ ext=Object.keys(F).filter(function(k){ return KT.indexOf(k)<0&&k!=='fecha'||(KT.indexOf(k)>=0&&!_wObj(F[k])&&!_wNil(F[k])); }).map(function(k){ return '<div class="odw-r"><span title="'+esc(k)+'">'+esc(_wKey(k))+'</span><div>'+_wV(F[k])+'</div></div>'; }).join(''); }
  var cOtr=_wCard('Otros datos',ext,'w');
  var raw=''; if(F){ try{ raw='<details class="odw-raw"><summary>Datos en bruto</summary><pre>'+esc(JSON.stringify(F,null,1))+'</pre></details>'; }catch(e){ raw=''; } }
  return '<details class="od-web'+(rv?' rev':'')+'"'+(rv?' open':'')+'>'+head+'<div class="od-web-b">'+alerta
    +'<div class="odw-g">'+cPrecio+cCli+cPla+cPro+cArc+cCol+cTas+cDet+cOtr+'</div>'
    +(F?raw:'<div class="odw-none" style="margin-top:8px">Esta solicitud no trae el formulario completo.</div>')+'</div></details>'; }
function webMarkReviewed(id){ var o=getOrder(id); if(!o)return; o.web_revisar=false; save(); reopenOrder(id); try{ if(view==='ord')renderOrders(); }catch(e){} }

/* ===== init ===== */
applyBrand();
/* Guarda la migración de archivados y avisa a 3DTracker de la nueva clasificación. */
function _migFlush(){ if(!window._migDirty)return; window._migDirty=false; (S.orders||[]).forEach(function(o){ if(o&&o._mig){ delete o._mig; if(o.tracked)trackerLink(o); } }); save(); }
function _purge(){ try{localStorage.removeItem(SK);localStorage.removeItem(SK+'_ts');}catch(e){} }
(function(){
  function _msg(h,p){ var el=document.getElementById('view'); if(el&&!loaded)el.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--mut)"><div style="font-size:40px">\u2601\ufe0f</div><h3 style="margin:12px 0 6px">'+h+'</h3><p>'+p+'</p></div>'; }
  try{document.getElementById('vtitle').textContent='Dashboard';}catch(e){}
  _msg('Cargando tus datos\u2026','Conectando con tu cuenta de Firebase.');
  var _sub=false, _first=true;
  function applyRemote(d){
    if(_first){
      _first=false;
      if(d && d.data && typeof d.data==='object'){ S=d.data; migNames(S); loaded=true; _webMarkLoaded(); applyBrand(); _purge(); go('dash'); _migFlush(); webWatchSync(); return; }
      var old=null; try{ old=JSON.parse(localStorage.getItem(SK)); }catch(e){}
      if(old && typeof old==='object'){ S=old; migNames(S); loaded=true; _webMarkLoaded(); applyBrand(); go('dash'); _migFlush(); cloudPush(); webWatchSync(); return; }
      loaded=true; _webMarkLoaded(); applyBrand(); go('dash'); cloudPush(); webWatchSync(); return;
    }
    if(!d||!d.data||typeof d.data!=='object')return;
    if((d.updated||0)<=myTs)return;
    if(_cfgDirty){ _cfgHeldRemote=d; return; }   /* hay cambios de Configuración sin confirmar: se aplica al terminar */
    S=d.data; migNames(S); applyBrand(); render(); _migFlush();
  }
  function startCloud(){
    try{ window.DPCloud.onAuth(function(){ try{ webWatchSync(); }catch(e){} }); }catch(e){}   /* solicitudes web: engancha/suelta la escucha si cambia la sesión */
    try{ window.DPCloud.onAuth(function(_u){
      if(!_u||_sub)return; _sub=true;
      if(window.DPCloud.watchState){ window.DPCloud.watchState('3dcalc', applyRemote); }
      else { window.DPCloud.loadState('3dcalc').then(function(data){ applyRemote(data?{data:data,updated:Date.now()}:null); }).catch(function(){ loaded=true; go('dash'); }); }
    }); }catch(e){}
    setTimeout(function(){ if(!loaded) _msg('Inicia sesi\u00f3n para ver tus datos','Vuelve al inicio de la suite e inicia sesi\u00f3n. Si ya lo hiciste, recarga con Ctrl+Shift+R.'); }, 8000);
  }
  var w=0;(function c(){ if(window.DPCloud&&window.DPCloud.onAuth){ startCloud(); } else if(w<10000){ w+=150; setTimeout(c,150); } else { _msg('No se pudo conectar con Firebase','Recarga la p\u00e1gina (Ctrl+Shift+R).'); } })();
})();
</script>
<script>if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)document.body.classList.add('side-off');</script>
<script>
/* Ayuda contextual de la app (icono ? en el banner superior) */
(function(){
  if(window.DPHelp) return;
  var C={"title": "3DCalc", "accent": "#00DDB8", "tagline": "Precio de impresión con desglose", "sections": [{"h": "Qué es", "p": "Calcula el precio de cada impresión con desglose (filamento, tiempo, energía y mano de obra) e inventario de filamentos."}, {"h": "Primeros pasos", "steps": ["Configura tus parámetros: coste de energía, margen y mano de obra.", "Mantén al día el inventario de filamentos.", "Crea un cálculo introduciendo gramos y tiempo.", "Consulta el desglose y, si quieres, actívalo como pedido en 3DTracker."]}, {"h": "Funciones clave", "defs": [["Desglose de coste", "Ve cuánto aporta cada factor al precio."], ["Inventario", "Filamentos con coste por kilo."], ["Lógica editable", "Ajusta las fórmulas a tu caso."], ["A 3DTracker", "Genera un pedido con código de seguimiento."], ["Catálogo", "Fichas de producto con medidas y precio estimado."]]}]};
  var CSS=".dph-veil{position:fixed;inset:0;z-index:99998;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,15,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.dph-veil.open{display:flex}.dph-modal{width:min(660px,96vw);max-height:88vh;overflow:auto;background:#12141d;color:#e7eaf2;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);font-family:'Outfit',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55}[data-theme=light] .dph-modal{background:#fff;color:#1b1e27;border-color:rgba(0,0,0,.1)}.dph-hd{position:sticky;top:0;display:flex;align-items:center;gap:11px;padding:15px 18px;background:inherit;border-bottom:1px solid rgba(255,255,255,.09);border-radius:16px 16px 0 0}[data-theme=light] .dph-hd{border-color:rgba(0,0,0,.09)}.dph-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}.dph-ti{font-weight:700;font-size:16px}.dph-tg{font-size:12px;opacity:.7}.dph-x{margin-left:auto;border:none;background:transparent;color:inherit;opacity:.55;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}.dph-x:hover{opacity:1}.dph-bd{padding:4px 18px 20px}.dph-sec{margin-top:15px}.dph-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.6;margin-bottom:5px}.dph-p{margin:0 0 3px}.dph-bd ul,.dph-bd ol{margin:4px 0 0;padding-left:20px}.dph-bd li{margin:3px 0}.dph-def{display:flex;gap:10px;margin:5px 0}.dph-def b{flex-shrink:0;min-width:130px}";
  var HDIC="<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9.3\"/><path d=\"M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.2-2.7 4\"/><circle cx=\"12\" cy=\"17.3\" r=\".6\" fill=\"currentColor\"/></svg>";
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function render(){
    var h='<div class="dph-modal" role="dialog" aria-modal="true" aria-label="Ayuda">';
    h+='<div class="dph-hd"><span class="dph-ic" style="background:'+(C.accent||'#5b8cff')+'">'+HDIC+'</span><div><div class="dph-ti">'+esc(C.title)+'</div><div class="dph-tg">'+esc(C.tagline||'')+'</div></div><button class="dph-x" aria-label="Cerrar" title="Cerrar">&times;</button></div>';
    h+='<div class="dph-bd">';
    (C.sections||[]).forEach(function(s){
      h+='<div class="dph-sec"><div class="dph-h">'+esc(s.h)+'</div>';
      if(s.p) h+='<p class="dph-p">'+esc(s.p)+'</p>';
      if(s.steps){ h+='<ol>'; s.steps.forEach(function(x){ h+='<li>'+esc(x)+'</li>'; }); h+='</ol>'; }
      if(s.list){ h+='<ul>'; s.list.forEach(function(x){ h+='<li>'+esc(x)+'</li>'; }); h+='</ul>'; }
      if(s.defs){ s.defs.forEach(function(d){ h+='<div class="dph-def"><b>'+esc(d[0])+'</b><span>'+esc(d[1])+'</span></div>'; }); }
      h+='</div>';
    });
    h+='</div></div>';
    return h;
  }
  var veil=null;
  function ensure(){ if(veil) return;
    var st=document.createElement('style'); st.textContent=CSS; document.head.appendChild(st);
    veil=document.createElement('div'); veil.className='dph-veil';
    veil.addEventListener('click',function(e){ if(e.target===veil) close(); });
    document.body.appendChild(veil);
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  }
  function open(){ ensure(); veil.innerHTML=render(); var x=veil.querySelector('.dph-x'); if(x)x.addEventListener('click',close); veil.classList.add('open'); }
  function close(){ if(veil) veil.classList.remove('open'); }
  window.DPHelp={ open:open, close:close };
})();
</script>
