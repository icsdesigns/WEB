function saveClient(id){
  var name=document.getElementById('cf_name').value.trim(); if(!name){alert('El nombre es obligatorio');return;}
  var obj={id:id||uid(),name:name,email:document.getElementById('cf_email').value.trim(),phone:document.getElementById('cf_phone').value.trim(),tax_id:document.getElementById('cf_tax').value.trim(),address:document.getElementById('cf_addr').value.trim(),default_discount:num(document.getElementById('cf_disc').value),notes:document.getElementById('cf_notes').value};
  if(id){ S.clients=S.clients.map(function(c){return c.id===id?obj:c;}); } else { S.clients.push(obj); }
  save(); closeModal(); renderClients();
}
function delClient(id){ var c=S.clients.filter(function(x){return x.id===id;})[0]; if(!c)return; if(!confirm('¿Eliminar a '+c.name+'? Sus pedidos no se borran.'))return; S.clients=S.clients.filter(function(x){return x.id!==id;}); save(); renderClients(); }
function clientHistory(id){
  var c=S.clients.filter(function(x){return x.id===id;})[0]; if(!c)return; var st=clientStats(c.name);
  var rows=st.orders.map(function(o){return '<tr><td>'+esc(o.fecha||'-')+'</td><td>'+esc(o.descripcion||'')+'</td><td style="text-align:right">'+eur(o.precio_final)+'</td><td>'+esc(o.estado)+'</td></tr>';}).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--t2);padding:14px">Sin pedidos</td></tr>';
  openModal('<h3>Historial: '+esc(c.name)+'</h3>'
   +'<div class="kpis" style="grid-template-columns:1fr 1fr;margin-bottom:14px"><div class="kpi"><div class="k-l">Total pedidos</div><div class="k-v">'+st.count+'</div></div><div class="kpi"><div class="k-l">Total invertido</div><div class="k-v" style="color:var(--ac)">'+eur(st.total)+'</div></div></div>'
   +'<table class="t"><thead><tr><th>Fecha</th><th>Descripción</th><th style="text-align:right">Total</th><th>Estado</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'<div style="text-align:right;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>');
}
function syncClientsFromOrders(){ var n0=(S.clients||[]).length; (S.orders||[]).forEach(function(o){ ensureClient(o); }); return (S.clients||[]).length!==n0; }
function renderClients(){ if(syncClientsFromOrders())save();
  var list=S.clients.map(function(c){var st=clientStats(c.name);return Object.assign({},c,{_c:st.count,_t:st.total});}).filter(function(c){if(!cliQ)return true;return ((c.name+' '+(c.email||'')+' '+(c.tax_id||'')+' '+(c.phone||'')).toLowerCase().indexOf(cliQ)>=0);});
  var rows=list.map(function(c){
    return '<tr><td><div style="font-weight:700">'+esc(c.name)+'</div><div style="font-size:11.5px;color:var(--t2)">'+esc(c.email||'Sin email')+'</div></td>'
     +'<td>'+esc(c.tax_id||'')+'</td><td>'+esc(c.phone||'')+'</td>'
     +'<td style="text-align:center"><button class="btn ghost" style="padding:4px 11px" onclick="clientHistory(\''+c.id+'\')">'+c._c+'</button></td>'
     +'<td style="text-align:right;font-weight:600">'+eur(c._t)+'</td>'
     +'<td style="text-align:right;white-space:nowrap"><button class="del" title="Editar" onclick="editClientById(\''+c.id+'\')">✎</button> <button class="del" title="Historial" onclick="clientHistory(\''+c.id+'\')">↺</button> <button class="del" title="Eliminar" onclick="delClient(\''+c.id+'\')">✕</button></td></tr>';
  }).join('');
  document.getElementById('view').innerHTML=
   '<div class="h1">Gestión de clientes</div><div class="h-sub">Tus clientes con su nº de pedidos y total invertido (calculado desde Pedidos).</div>'
   +'<div class="ord-toolbar"><input class="inp ord-search" placeholder="Buscar cliente…" value="'+esc(cliQ)+'" oninput="cliSearch(this.value)"><span class="sp"></span><button class="btn" onclick="newClient()">＋ Nuevo cliente</button></div>'
   +'<div class="card">'
   +(list.length?'<table class="t"><thead><tr><th>Nombre</th><th>DNI/CIF</th><th>Teléfono</th><th style="text-align:center">Pedidos</th><th style="text-align:right">Total invertido</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">No hay clientes registrados.</div>')
   +'</div>';
}


/* ===== util extra ===== */
function toast3(msg,clr){ var t=document.getElementById('toast3'); if(!t){t=document.createElement('div');t.id='toast3';document.body.appendChild(t);} t.textContent=msg; t.style.borderColor=(clr||'var(--ac)'); t.style.color=(clr||'var(--ac)'); t.classList.add('show'); clearTimeout(toast3._t); toast3._t=setTimeout(function(){t.classList.remove('show');},2800); }
function fmtD(iso){ if(!iso)return''; try{return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return'';} }
function pmContrast(hex){ try{var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (r*299+g*587+b*114)/1000>145?'#1a1a1a':'#fff';}catch(e){return '#fff';} }
function getOrder(id){ return S.orders.filter(function(o){return o.id===id;})[0]; }
function ensureClient(o){ if(!o||!o.cliente)return; var name=String(o.cliente).trim(); if(!name)return; if(!Array.isArray(S.clients))S.clients=[]; var ex=S.clients.filter(function(c){return (c.name||'').toLowerCase()===name.toLowerCase();})[0]; if(!ex){ S.clients.push({id:uid(),name:name,email:o.cliente_email||'',phone:'',tax_id:'',address:'',default_discount:0,notes:'Creado automáticamente desde un pedido.'}); } else if(o.cliente_email && !ex.email){ ex.email=o.cliente_email; } }
function autoArchive(o){ if(o && !o.archived && o.estado==='Entregado' && num(o.precio_final)>0 && num(o.importe_pagado)>=num(o.precio_final)) o.archived=true; }
function applyBrand(){ try{var c=S.global_config&&S.global_config.brand_color; if(c){var hex=(c[0]==='#'?c:('#'+c)); if(/^#[0-9a-fA-F]{6}$/.test(hex)){document.documentElement.style.setProperty('--ac',hex);document.documentElement.style.setProperty('--ac2',hex);}}}catch(e){} }
function setBrand(v){ S.global_config.brand_color=v; save(); applyBrand(); }
function normOrder(o){ o=o||{}; o.payment_history=Array.isArray(o.payment_history)?o.payment_history:[]; o.material_contabilizado=!!o.material_contabilizado; o.archived=!!o.archived; o.repeticiones_error=num(o.repeticiones_error); o.imagen=o.imagen||''; if(o.importe_pagado==null)o.importe_pagado=0; return o; }

/* ===== gestión de pedidos (detalle) ===== */
var showArch=false;
function toggleArch(){ showArch=!showArch; renderOrders(); }
function setOrdField(id,f,v){ var o=getOrder(id); if(!o)return; if(['precio_final','importe_pagado','peso_g','horas','cantidad','gasto_misc'].indexOf(f)>=0)v=num(v); o[f]=v; if(f==='cliente'||f==='cliente_email')ensureClient(o); if(f==='importe_pagado'||f==='precio_final')autoArchive(o); save(); updateOrdBadge(); }
function consumeStock(o){
  var lines=[];
  if(o.is_multimaterial && Array.isArray(o.material_breakdown) && o.material_breakdown.length){
    o.material_breakdown.forEach(function(it){ if(it.material && num(it.grams)>0) lines.push({material:it.material,color:it.color||'',grams:num(it.grams)}); });
  } else {
    lines.push({material:o.filamento||'', color:o.filamento_color||'', grams:num(o.peso_g)*(num(o.cantidad)||1)});
  }
  var low=[];
  lines.forEach(function(ln){
    if(!ln.material||ln.grams<=0)return;
    var item=S.filament_stock.filter(function(s){return s.material===ln.material && String(s.color||'').toLowerCase()===String(ln.color||'').toLowerCase();})[0];
    if(!item){ item={material:ln.material,color:ln.color||'Negro',remaining_g:0,buy_threshold_g:150}; S.filament_stock.push(item); }
    item.remaining_g=Math.round((num(item.remaining_g)-ln.grams)*100)/100;
    if(num(item.remaining_g)<=num(item.buy_threshold_g)) low.push(item.material+' ('+(item.color||'')+'): '+num(item.remaining_g).toFixed(0)+' g');
  });
  o.material_contabilizado=true;
  if(low.length) toast3('Stock bajo → '+low.join(' · '),'#F4B740'); else toast3('Material descontado del inventario','#34D399');
}
function setOrderEstado(id,estado){ var o=getOrder(id); if(!o)return; o.estado=estado; o.status_updated_at=Date.now(); o.notif_snooze_until=0; if(estado==='Activo' && !o.material_contabilizado) consumeStock(o); save(); updateOrdBadge(); syncTracker(o); cajonSync(o); }
/* ── Sincronización con 3DTracker ────────────────────────────────────────────
   Los pedidos con seguimiento activado (o.tracked) replican su clasificación
   de 3DCalc en 3DTracker: activo / finalizado / archivado. */
function trackerStateOf(o){
  if(!o)return null;
  if(o.archived)return 'archivado';
  var e=ordState(o);
  if(e==='Finalizado')return 'finalizado';
  if(e==='Activo')return 'activo';
  return 'pendiente';
}
function syncTracker(o){
  try{
    if(!o||!o.tracked)return;
    var code=o.order_code||o.number; if(!code)return;
    if(!(window.DPCloud&&window.DPCloud.updateOrder))return;
    var st=trackerStateOf(o);
    var campos={ calc_status:st, calc_synced_at:Date.now(), archived:!!o.archived };
    if(st==='activo'&&!o.tracker_activated_at){ o.tracker_activated_at=Date.now(); campos.activated_at=new Date().toISOString(); }
    if(st==='archivado'){ campos.archived_at=(o.archived_at||Date.now()); }
    window.DPCloud.updateOrder(code,campos).catch(function(){});
  }catch(e){}
}
/* Los pedidos archivados pierden el seguimiento a los 3 meses de archivarse. */
function purgeOldTracking(){
  try{
    if(!(window.DPCloud&&window.DPCloud.deleteOrder))return;
    var LIM=90*24*60*60*1000, ahora=Date.now(), ch=false;
    (S.orders||[]).forEach(function(o){
      if(!o||!o.tracked||!o.archived||!o.archived_at)return;
      if((ahora-num(o.archived_at))<LIM)return;
      var code=o.order_code||o.number; if(!code)return;
      window.DPCloud.deleteOrder(code).catch(function(){});
      o.tracked=false; o.tracker_purged_at=ahora; ch=true;
    });
    if(ch)save();
  }catch(e){}
}
function activateInTracker(id){ var o=getOrder(id); if(!o)return; if(!(window.DPCloud&&window.DPCloud.createOrder)){ toast3('3DTracker no disponible ahora','#FF6B8A'); return; }
  var code=o.number; toast3('Activando en 3DTracker\u2026','#4D9FFF');
  function nav(){ try{ window.parent.postMessage({__dp3:true,type:'openTrackerOrder',code:code},'*'); }catch(e){} closeModal(); }
  function markAndGo(){ o.estado='Activo'; o.status_updated_at=Date.now(); o.notif_snooze_until=0; o.tracked=true; try{ if(!o.material_contabilizado)consumeStock(o); }catch(e){} try{ myTs=Date.now(); var p=window.DPCloud.saveState('3dcalc',S,myTs); if(p&&p.then){ p.then(nav,nav); return; } }catch(e){} save(); nav(); }
  function create(){ window.DPCloud.createOrder({order_code:code,customer_name:o.cliente||'',customer_email:o.cliente_email||'',description:o.descripcion||''}).then(markAndGo).catch(function(){ toast3('No se pudo crear el pedido en 3DTracker','#FF6B8A'); }); }
  if(window.DPCloud.getOrderByCode){ window.DPCloud.getOrderByCode(code).then(function(ex){ if(ex) markAndGo(); else create(); }).catch(create); } else create(); }
function openOrder(id){ var o=getOrder(id); if(o) openModal(orderModalHTML(o)); }
function reopenOrder(id){ var o=getOrder(id); if(o) openModal(orderModalHTML(o)); renderOrders(); }
function setOrdParam(id,f,v){ var o=getOrder(id); if(!o)return; if(['peso_g','horas','cantidad','gasto_misc'].indexOf(f)>=0)v=num(v); o[f]=v; if(f==='filamento')o.is_multimaterial=false; try{ var r=compute(orderToCalcState(o)); var _dd3=orderDual(o); o.precio_final=(o.urgencia_nivel==='Urgente'?_dd3.urgente:(o.urgencia_nivel==='Ambos'?_dd3.urgente:r.precio)); o.precio_normal=(o.urgencia_nivel==='Ambos'?_dd3.normal:null); o.precio_urgente=(o.urgencia_nivel==='Ambos'?_dd3.urgente:null); o.coste_bruto=roundMoney(r.bruto); o.beneficio_neto=roundMoney(r.beneficioNeto); }catch(e){} save(); reopenOrder(id); }
function setOrdParamTime(id,el){ var d=hmToDec(el.value); setOrdParam(id,'horas',String(d)); }
function setOrdMeta(id,f,v){ var o=getOrder(id); if(!o)return; o[f]=v; if(f==='cliente'||f==='cliente_email')ensureClient(o); save(); }
function _odBrk(r){
  function row(l,v,p){return '<div class="odb-r"><span>'+l+'</span><b>'+((p&&(v||0)>0)?'+':'')+eur(v)+'</b></div>';}
  function grp(l){return '<div class="odb-grp">'+l+'</div>';}
  function sub(l,v){return '<div class="odb-r odb-sub"><span>'+l+'</span><b>'+eur(v)+'</b></div>';}
  var h=grp('Parámetros básicos')+row('Filamento',r.filamento)+row('Electricidad',r.electricidad)+row('Deterioro impresora',r.deterioro)+sub('Subtotal básico',r.bruto);
  if(r.resto>0){ h+=grp('Parámetros complementarios')+row('Diseño y modelado',r.diseno)+row('Búsqueda de modelos',r.busqueda)+row('Eliminación de soportes',r.soportes)+row('Post-procesado',r.postproc)+sub('Subtotal complementarios',r.resto); }
  h+=grp('Márgenes y beneficio')+row('Markup (×'+r.markup.toFixed(1)+')',r.markupVal,true);
  if(r.errorVal>0)h+=row('Fondo de error',r.errorVal,true);
  if(r.recargo>0)h+=row('Plus urgencia',r.recargo,true);
  if(r.gastoMisc>0)h+=row('Extras / misc.',r.gastoMisc,true);
  h+=sub('Beneficio neto',r.beneficioNeto);
  if(r.accesorios>0)h+=grp('Utilitarios')+row('Accesorios',r.accesorios);
  return h;
}

function computeOrder(o){
  var g=S.global_config;
  var printer=S.printers.filter(function(p){return p.name===o.impresora;})[0]||S.printers[0]||{};
  var horas=num(o.horas), peso=num(o.peso_g);
  var pricekg=0, filOverride=null, filName=o.filamento, filColor=o.filamento_color||'';
  if(o.is_multimaterial && Array.isArray(o.material_breakdown) && o.material_breakdown.length){
    var tw=0,tc=0,mats=[];
    o.material_breakdown.forEach(function(it){var m=String(it.material||'').trim();var gr=num(it.grams); if(m&&gr>0){var ft=S.filament_types.filter(function(f){return f.name===m;})[0];var ppk=ft?num(ft.price_per_kg):0; tw+=gr; tc+=gr*ppk/1000; if(mats.indexOf(m)<0)mats.push(m);}});
    if(tw>0){peso=Math.round(tw*100)/100; filOverride=round4(tc); pricekg=tc*1000/tw; filName=mats.join(' + '); filColor='Multicolor';}
  } else { var ft0=S.filament_types.filter(function(f){return f.name===o.filamento;})[0]; pricekg=ft0?num(ft0.price_per_kg):0; }
  var markup=MARKUP[o.markup]!=null?MARKUP[o.markup]:(num(o.markup)||2.3);
  var errorRate=PROBABILIDAD_ERROR.hasOwnProperty(o.probabilidad_error)?PROBABILIDAD_ERROR[o.probabilidad_error]:(num(o.error_rate)||0.25);
  var urg=0; /* recargo urgente variable por días ganados */
  var labor=num(g.labor_cost_h);
  var filamento=round4(peso*pricekg/1000); if(filOverride!=null)filamento=filOverride;
  var electricidad=round4(horas*num(printer.energy_consumption_kwh)*num(g.energy_cost_kwh));
  var diseno=round4(disenoImporte(o.diseno_modelado,o.diseno_opt));
  var busqueda=0;   // integrado como un nivel más del propio diseño
  var soportes=round4(((ELIMINACION_SOPORTES[o.eliminacion_soportes]||0)/60)*labor);
  var deterioro=round4(horas*depPerHour(printer));
  var postproc=round4(((POSTPROCESADO[o.postprocesado]||0)/60)*labor);
  var gastoMisc=round4(Math.max(0,num(o.gasto_misc)));
  var bruto=filamento+electricidad+deterioro, resto=diseno+busqueda+soportes+postproc+gastoMisc;
  var precioMin=num(g.precio_minimo);
  var bloqueA=Math.max(bruto*markup+bruto*errorRate+resto, precioMin);
  var minAplicado=(bruto*markup+bruto*errorRate+resto)<precioMin;
  var recargo=bloqueA*urg;
  var precioSinMisc=roundUpToNickel(bloqueA);
  var cant=Math.max(1,Math.floor(num(o.cantidad)||1));
  var markupVal=Math.max(0,bruto*(markup-1)), errorVal=Math.max(0,bruto*errorRate);
  /* Tasa del cajón: se guardó con el pedido, así que se refleja tal cual se cobró. */
  var cajonTipo=(o.tipo_proyecto||(o.prod&&o.prod.tipo)||'Técnico');
  var cajonBase=num(o.precio_base_cajon);
  var cajonTasa=cajonBase?cajonFee(cajonTipo,cajonBase,o.diseno_modelado):0;
  var cajonPct=cajonBase?cajonRate(cajonTipo,cajonBase,o.diseno_modelado):0;
  var bloqueC=accessoriesTotal(o);
  return {filName:filName,filColor:filColor,peso:peso,horas:horas,filamento:filamento,electricidad:electricidad,diseno:diseno,busqueda:busqueda,soportes:soportes,deterioro:deterioro,postproc:postproc,gastoMisc:gastoMisc,bruto:bruto,resto:resto,markup:markup,errorRate:errorRate,urg:urg,recargo:recargo,markupVal:markupVal,errorVal:errorVal,cant:cant,precioMin:precioMin,minAplicado:minAplicado,
    bloqueA:roundMoney(bloqueA),bloqueC:roundMoney(bloqueC),accesorios:roundMoney(bloqueC),
    cajonTipo:cajonTipo,cajonTasa:cajonTasa,cajonPct:cajonPct};
}
function ticketLines(o,kind){
  var u=S.global_config.money_unit||'€';
  var SEP='================================================';
  var SUB='------------------------------------------------';
  function L(lbl,val){ return '  '+String(lbl).padEnd(22)+String(val).padStart(11); }
  if(kind!=='empresa'){
    var cant=Math.max(1,num(o.cantidad)||1), total=num(o.precio_final), unit=total/cant;
    return ['CLIENTE  : '+(o.cliente||'-'),'FECHA    : '+(o.fecha||'-'),'PROYECTO : '+(o.descripcion||'-'),SUB,
      'DETALLES DEL TRABAJO',
      '  Material  : '+(o.filamento||'-')+(o.filamento_color?(' - '+o.filamento_color):''),
      '  Peso est. : '+(o.peso_g||0)+' g','  Tiempo    : '+(o.horas||0)+' h','  Urgencia  : '+(o.urgencia_nivel||'Normal'),
      SEP,'PRESUPUESTO',SEP,
      L('Precio unitario',unit.toFixed(2)+' '+u),L('Cantidad',cant+' ud.'),SUB,L('TOTAL A ABONAR',total.toFixed(2)+' '+u),SEP,
      'CONDICIONES','  - Precio final cerrado, incluye todos los costes.','  - Plazo sujeto a cola de impresion y complejidad.','  - Se solicita 50% de anticipo para confirmar.'];
  }
  var r=computeOrder(o), cant=r.cant, total=num(o.precio_final);
  var lines=['CLIENTE   : '+(o.cliente||'-'),'PROYECTO  : '+(o.descripcion||'-'),'IMPRESORA : '+(o.impresora||'-'),
    'MATERIAL  : '+(r.filName||'-')+(r.filColor?(' ('+r.filColor+')'):'')+' - '+r.peso+' g - '+r.horas+' h',SUB,
    'DESGLOSE DE COSTES  ('+cant+' ud.)','','-- COSTE BRUTO (Materia prima + Maquinaria) --',
    L('Filamento',r.filamento.toFixed(2)+' '+u),L('Electricidad',r.electricidad.toFixed(2)+' '+u),L('Deterioro imp.',r.deterioro.toFixed(2)+' '+u),
    SUB,L('SUBTOTAL BRUTO',r.bruto.toFixed(2)+' '+u)];
  if(r.resto>0){ lines.push('','-- COMPLEMENTOS (Mano de obra + Extras) --');
    if(r.diseno>0)lines.push(L('Diseno & modelado',r.diseno.toFixed(2)+' '+u));
    if(r.busqueda>0)lines.push(L('Busqueda modelos',r.busqueda.toFixed(2)+' '+u));
    if(r.soportes>0)lines.push(L('Elim. soportes',r.soportes.toFixed(2)+' '+u));
    if(r.postproc>0)lines.push(L('Postprocesado',r.postproc.toFixed(2)+' '+u));
    lines.push(SUB,L('SUBTOTAL COMPLEMENTOS',r.resto.toFixed(2)+' '+u)); }
  if(r.gastoMisc>0)lines.push(L('Extras / misc.',r.gastoMisc.toFixed(2)+' '+u));
  lines.push('','-- MARGENES Y BENEFICIO --',L('Markup (x'+r.markup.toFixed(1)+')','+'+r.markupVal.toFixed(2)+' '+u));
  if(r.errorVal>0)lines.push(L('Fondo error','+'+r.errorVal.toFixed(2)+' '+u));
  if(r.recargo>0)lines.push(L('Plus urgencia','+'+r.recargo.toFixed(2)+' '+u));
  var beneficio=r.markupVal+r.errorVal+r.recargo;
  lines.push(SUB,L('BENEFICIO NETO',beneficio.toFixed(2)+' '+u));
  if(r.minAplicado)lines.push('  * Tarifa minima aplicada: '+r.precioMin.toFixed(2)+' '+u);
  if(r.cajonTasa>0)lines.push('','-- CAJON DE AHORRO --',L('Tasa de ahorro ('+(r.cajonPct*100).toFixed((r.cajonPct*100)%1?1:0)+'% · '+(r.cajonTipo||'')+')','+'+r.cajonTasa.toFixed(2)+' '+u));
  lines.push(SEP,L('PRECIO UNITARIO',(total/cant).toFixed(2)+' '+u),L('CANTIDAD',cant+' ud.'),SUB,L('PVP FINAL',total.toFixed(2)+' '+u),SEP,
    '','Opciones: Dis='+(o.diseno_modelado||'-')+' | Busq='+(o.busqueda_modelos||'-'),
    '          Sop='+(o.eliminacion_soportes||'-')+' | Post='+(o.postprocesado||'-'),
    '          Err='+(o.probabilidad_error||'-')+' | Urg='+(o.urgencia_nivel||'-'));
  return lines;
}

var PDF_BOTTOM=282, PDF_TOP=20;
/* Mide la tarjeta de datos: cada valor se reparte en tantas líneas como necesite
   (una lista larga de colores, una descripción larga…) y la fila crece con él,
   de modo que nada se recorta ni se solapa con la fila siguiente. */
function _dataCardPrep(doc,w,rows){
  var pad=7, colW=w/2-pad-7, labH=5, lineH=4.6, gap=4.2, MAXL=14;
  var prep=(rows||[]).map(function(rw){
    var cells=[], maxL=1;
    for(var ci=0;ci<2;ci++){
      var lab=rw[ci*2], val=rw[ci*2+1];
      if(lab==null){ cells.push(null); continue; }
      var isLink=!!(val&&typeof val==='object'&&val.url);
      var vs=String(isLink?(val.v||''):(val==null?'':val));
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      var lines=doc.splitTextToSize(vs,colW);
      if(!lines.length)lines=[''];
      if(lines.length>MAXL){ lines=lines.slice(0,MAXL); lines[MAXL-1]=lines[MAXL-1]+'…'; }
      if(lines.length>maxL)maxL=lines.length;
      cells.push({lab:lab,lines:lines,url:isLink?val.url:null});
    }
    return {cells:cells,h:labH+maxL*lineH+gap};
  });
  var total=pad+pad-3;
  prep.forEach(function(r){ total+=r.h; });
  return {prep:prep,h:total,pad:pad,labH:labH,lineH:lineH};
}
function _dataCard(doc,x,y,w,rows){
  var m=_dataCardPrep(doc,w,rows), pad=m.pad, h=m.h;
  doc.setDrawColor(225,228,234); doc.setLineWidth(0.3); doc.setFillColor(250,251,252);
  doc.roundedRect(x,y,w,h,2.5,2.5,'FD');
  var colx=[x+pad+1, x+w/2+3], ry=y+pad+3;
  m.prep.forEach(function(rw){
    rw.cells.forEach(function(cell,ci){
      if(!cell)return;
      var cx=colx[ci];
      doc.setFont('helvetica','bold'); doc.setFontSize(7.3); doc.setTextColor(140,144,154);
      doc.text(String(cell.lab).toUpperCase(),cx,ry);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      cell.lines.forEach(function(ln,li){
        var ly=ry+m.labH+li*m.lineH;
        if(cell.url){
          doc.setTextColor(22,127,111);
          try{ doc.textWithLink(ln,cx,ly,{url:cell.url}); }catch(_e){ doc.text(ln,cx,ly); }
          var tw=doc.getTextWidth(ln); doc.setDrawColor(22,127,111); doc.setLineWidth(0.3); doc.line(cx,ly+1.2,cx+tw,ly+1.2);
        } else { doc.setTextColor(28,30,38); doc.text(ln,cx,ly); }
      });
    });
    ry+=rw.h;
  });
  return y+h;
}
/* Título + tarjeta como un bloque: si no cabe entero, salta de página junto con
   su título en vez de dejarlo huérfano al final de la hoja. */
function _pdfSection(doc,M,W,y,title,ac,rows){
  var w=W-2*M, m=_dataCardPrep(doc,w,rows);
  if(y+5+m.h>PDF_BOTTOM){ doc.addPage(); y=PDF_TOP; }
  doc.setTextColor(ac[0],ac[1],ac[2]); doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(title,M,y); y+=3;
  return _dataCard(doc,M,y+2,w,rows);
}
/* Alto aproximado de un párrafo de _pdfRich, para decidir el salto de página.
   Se mide en redonda y se añade una línea de margen porque las palabras en
   negrita son algo más anchas. */
function _pdfRichH(doc,tx,maxW,lineH){
  doc.setFont('helvetica','normal');
  var plain=String(tx==null?'':tx).replace(/\*\*/g,'');
  var n=doc.splitTextToSize(plain,maxW).length||1;
  return (n+1)*lineH;
}
function _pdfRich(doc,tx,x,y,maxW,lineH){
  var segs=[]; var re=/\*\*([^*]+)\*\*/g; var last=0,mm;
  while((mm=re.exec(tx))){ if(mm.index>last)segs.push([tx.slice(last,mm.index),false]); segs.push([mm[1],true]); last=re.lastIndex; }
  if(last<String(tx).length)segs.push([String(tx).slice(last),false]);
  var words=[]; segs.forEach(function(s){ s[0].split(/\s+/).forEach(function(w){ if(w)words.push([w,s[1]]); }); });
  doc.setFont('helvetica','normal'); var spaceW=doc.getTextWidth(' ');
  var cx=x, cy=y, first=true;
  words.forEach(function(w){ doc.setFont('helvetica',w[1]?'bold':'normal'); var ww=doc.getTextWidth(w[0]);
    if(!first && cx+spaceW+ww>x+maxW){ cx=x; cy+=lineH; first=true; }
    if(!first) cx+=spaceW;
    doc.text(w[0],cx,cy); cx+=ww; first=false;
  });
  doc.setFont('helvetica','normal');
  return cy;
}

function pdfFileName(o,kind){

/* ===== estadísticas ampliadas ===== */
function statsExtra(os){
  var act=['Aceptado','En producción','Post-procesado','Listo para entregar','Entregado'];
  var byMat={};
  os.forEach(function(o){ if(act.indexOf(o.estado)>=0){ var m=o.filamento||'—'; byMat[m]=(byMat[m]||0)+num(o.peso_g)*(num(o.cantidad)||1); } });
  var arr=Object.keys(byMat).map(function(k){return [k,byMat[k]];}).filter(function(x){return x[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  var maxM=arr.reduce(function(m,x){return Math.max(m,x[1]);},1);
  var bars=arr.length?arr.map(function(x){var pct=Math.round(x[1]/maxM*100);return '<div class="hb"><span class="name">'+esc(x[0])+'</span><span class="track"><i style="width:'+pct+'%;background:var(--ac)"></i></span><span class="val">'+Math.round(x[1])+' g</span></div>';}).join(''):'<div class="empty">Sin datos.</div>';
  var benef=os.filter(function(o){return o.estado==='Entregado';}).reduce(function(a,o){return a+num(o.beneficio_neto);},0);
  var errs=os.reduce(function(a,o){return a+num(o.repeticiones_error);},0);
  return '<div class="chartbox"><div class="card-h">Uso de filamento por material (aceptados+)</div><div class="hbars">'+bars+'</div></div>'
    +'<div class="chartbox"><div class="card-h">Beneficio neto (entregados)</div><div style="font-size:26px;font-weight:800;color:#34D399">'+eur(benef)+'</div><div class="note">Repeticiones por error acumuladas: <b>'+errs+'</b></div></div>';
}

var purgePrinter='';

function purgeActive(){ if(!purgePrinter)purgePrinter=(S.printers[0]&&S.printers[0].name)||''; var a=(S.purge.active&&S.purge.active[purgePrinter])||[]; var cols=purgeColors(); return a.filter(function(c){return cols.indexOf(c)>=0;}); }
function purgeToggle(c){ S.purge.active=S.purge.active||{}; var cur=(S.purge.active[purgePrinter]||[]).slice(); var i=cur.indexOf(c); if(i>=0)cur.splice(i,1); else cur.push(c); S.purge.active[purgePrinter]=cur; save(); renderPurge(); }
function purgeVal(f,t){ var e=(S.purge.values||[]).filter(function(v){return v.printer===purgePrinter&&v.from===f&&v.to===t;})[0]; return e?e.grams:''; }
function purgeSet(f,t,val){ S.purge.values=S.purge.values||[]; var arr=S.purge.values; var i=arr.findIndex(function(v){return v.printer===purgePrinter&&v.from===f&&v.to===t;}); var s=String(val).trim(); if(s===''){ if(i>=0)arr.splice(i,1);} else { var g=num(s); if(i>=0)arr[i].grams=g; else arr.push({printer:purgePrinter,from:f,to:t,grams:g}); } save(); }
