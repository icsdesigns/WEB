<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>3DLab — SILAB3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module" src="../../firebase/dpcloud.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#07080F; --panel:#0E1018; --panel2:#141726; --glass:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.17);
  --t1:#E8EBF4; --t2:#9BA1BC; --t3:#6E7491;
  --ac:#8B7CFF; --ac2:#6C5CE7; --ac-soft:rgba(139,124,255,.13); --ac-line:rgba(139,124,255,.40);
  --sel-bg:rgba(139,124,255,.17);
  --ok:#34D399; --warn:#F4B740; --bad:#FF6B6B;
  --ok-t:#6EE7B7; --warn-t:#F8CD76; --bad-t:#FF9A9A;
  --shadow:0 14px 44px rgba(0,0,0,.5);
  --ease:cubic-bezier(.2,.7,.2,1);
  --pad:24px; --gap:18px;
}
[data-theme=light]{
  color-scheme:light;
  --bg:#F2F4F8; --panel:#FFFFFF; --panel2:#F5F6FB; --glass:#FFFFFF;
  --border:rgba(18,22,34,.12); --border2:rgba(18,22,34,.26);
  --t1:#12151C; --t2:#454C5C; --t3:#656C79;
  --ac:#6C5CE7; --ac2:#5B4BD6; --ac-soft:rgba(108,92,231,.10); --ac-line:rgba(108,92,231,.45);
  --sel-bg:rgba(108,92,231,.14);
  --ok:#10B981; --warn:#D99A0B; --bad:#E5484D;
  --ok-t:#047857; --warn-t:#8A5A00; --bad-t:#B42318;
  --shadow:0 14px 36px rgba(16,24,40,.16);
}
html,body{height:100%;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);-webkit-text-size-adjust:100%}
body{overflow:hidden;font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== banner ===== */
.appbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:9500;display:flex;align-items:center;gap:9px;padding:0 14px;background:rgba(10,11,18,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
[data-theme=light] .appbar{background:rgba(255,255,255,.88)}
.chip{width:30px;height:30px;border-radius:9px;background:var(--ac-soft);border:1px solid var(--ac-line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ab-name{font-weight:700;font-size:15px;letter-spacing:-.2px}
.ab-sp{flex:1}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--t1);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s,transform .1s}
.ib:hover{background:var(--glass);border-color:var(--border2)}
.ib:active{transform:scale(.94)}
.ib[disabled]{opacity:.35;pointer-events:none}
.ab-back{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--t1);font:500 12.5px 'Outfit',sans-serif;flex-shrink:0;transition:background .15s}
.ab-back:hover{background:var(--glass)}
.save{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);transition:background .2s}
.save.saving i{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.save.off i,.save.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:640px){.ab-bktx,.ab-name,.save b{display:none}.ab-back{padding:0 9px}.save{padding:0 8px}}

/* ===== layout ===== */
.layout{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex}
.side{width:296px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);transition:margin-left .25s var(--ease),transform .25s var(--ease)}
body.side-off .side{margin-left:-296px}
.side-top{padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--glass);padding:0 12px 0 34px;font-size:13.5px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--ac)}
.search input::placeholder{color:var(--t3)}
.nav{display:flex;flex-direction:column;gap:3px}
.navb{height:38px;width:100%;padding:0 12px;border:1px solid transparent;border-radius:11px;background:transparent;font:600 13.5px 'Outfit',system-ui,sans-serif;display:flex;align-items:center;gap:10px;color:var(--t2);text-align:left;transition:background .15s,color .15s,border-color .15s}
.navb:hover{background:var(--glass);color:var(--t1)}
.navb.on{background:var(--ac-soft);border-color:var(--ac-line);color:var(--ac)}
.cta{height:38px;border:none;border-radius:11px;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;font:600 13.5px 'Outfit',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;transition:filter .15s,transform .1s;box-shadow:0 6px 18px -8px var(--ac)}
.cta:hover{filter:brightness(1.1)}
.cta:active{transform:translateY(1px)}
.side-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);padding:12px 18px 4px}
.mini-ib{width:24px;height:24px;border:1px solid transparent;background:transparent;border-radius:7px;color:var(--t3);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.mini-ib:hover{background:var(--glass);color:var(--t1)}
.tree{flex:1;overflow:auto;padding:2px 8px 24px}
.tree-empty{color:var(--t2);font-size:13px;padding:12px 10px;line-height:1.6}
.trow{display:flex;align-items:center;gap:7px;min-height:34px;padding:4px 6px 4px 8px;border-radius:9px;cursor:pointer;position:relative;user-select:none;transition:background .12s;outline-offset:-2px}
.trow.in{animation:rowIn .2s var(--ease) backwards}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.trow:hover{background:var(--glass)}
.trow.on{background:var(--ac-soft)}
.trow.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--ac)}
.trow.l1{margin-left:14px}.trow.l2{margin-left:28px}
.tcaret{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:transform .15s var(--ease);flex-shrink:0}
.tcaret.op{transform:rotate(90deg)}
.tcaret-sp{width:16px;flex-shrink:0}
.tic{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--ac);flex-shrink:0}
.tlabel{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tcount{font-size:11px;color:var(--t3);flex-shrink:0}
.tacts{display:none;gap:1px;flex-shrink:0}
.trow:hover .tacts,.trow:focus-within .tacts,.trow:focus .tacts{display:flex}
.trow:hover .tcount,.trow:focus-within .tcount,.trow:focus .tcount{display:none}
.tact{width:24px;height:24px;border:none;background:transparent;color:var(--t2);border-radius:7px;display:flex;align-items:center;justify-content:center}
.tact:hover{background:var(--ac-soft);color:var(--ac)}
.tact.dl:hover{background:rgba(255,107,107,.15);color:var(--bad)}
.tempty{padding:5px 14px;font-size:12px;color:var(--t3)}
.tempty.l1{margin-left:28px}.tempty.l2{margin-left:42px}
@media(hover:none){.tacts{display:flex}.tcount{display:none}}
.scrim{display:none}
.main{flex:1;overflow:auto;min-width:0;scroll-padding-top:90px;position:relative}
.view{animation:viewIn .24s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){
  .side{position:fixed;top:52px;bottom:0;left:0;z-index:9400;width:86vw;max-width:310px;margin-left:0!important;box-shadow:var(--shadow)}
  body.side-off .side{transform:translateX(-105%);box-shadow:none}
  body:not(.side-off) .scrim{display:block;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.5);z-index:9300;animation:fadeIn .2s both}
  :root{--pad:14px;--gap:14px}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== botones ===== */
.btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--t1);font:600 12.5px 'Outfit',system-ui,sans-serif;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn:hover{background:var(--glass);border-color:var(--border2)}
.btn:active{transform:translateY(1px)}
.btn.pri{border-color:var(--ac-line);background:var(--ac-soft);color:var(--ac)}
.btn.pri:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.solid{background:linear-gradient(120deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.btn.solid:hover{filter:brightness(1.1);background:linear-gradient(120deg,var(--ac),var(--ac2))}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);background:rgba(255,107,107,.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:15px;height:15px}
@media(max-width:760px){.btn .lbl{display:none}.btn.keep .lbl{display:inline}.st-h .st-acts{width:100%;margin-left:0;justify-content:flex-end}.st-h .badges{width:100%;order:3}.st-tools{gap:6px}}

/* ===== cabecera de test ===== */
.tv-head{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:12px var(--pad) 10px}
.tv-bc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:500;flex-wrap:wrap}
.tv-bc button{border:none;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}
.tv-bc button:hover{color:var(--ac);text-decoration:underline}
.tv-bc span{opacity:.5}
.tv-bc>span:not(:empty){min-width:0;overflow-wrap:anywhere}
.tv-row{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.tname{flex:1 1 280px;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--t1);font:700 21px 'Outfit',system-ui,sans-serif;letter-spacing:-.3px;padding:3px 10px;margin-left:-10px;transition:border-color .15s,background .15s}
.tname:hover{border-color:var(--border)}
.tname:focus{outline:none;border-color:var(--ac);background:var(--glass)}
.tv-acts{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
@media(max-width:760px){.tv-head{position:static}.main{scroll-padding-top:0}.tname{font-size:18px;flex-basis:100%;margin-left:-10px}.tv-acts{width:100%}.tv-acts .btn.keep{flex:1;justify-content:center}}

.body{padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap);max-width:1700px;margin:0 auto;width:100%}
.card{background:var(--glass);border:1px solid var(--border);border-radius:16px;transition:border-color .2s,box-shadow .2s}
[data-theme=light] .card{box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05)}
.card:focus-within{border-color:var(--border2)}
.desc{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:14px;color:var(--t1);font:400 14px/1.5 'Outfit',sans-serif;padding:12px 15px;outline:none;resize:none;min-height:46px;overflow:hidden;transition:border-color .15s}
.desc:focus{border-color:var(--ac)}
.desc::placeholder{color:var(--t3)}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;font-weight:700;flex:1;min-width:140px;display:flex;align-items:center;gap:8px}
.sec-h h2 small{font-size:12px;font-weight:500;color:var(--t3)}
.sec-acts{display:flex;gap:7px;flex-wrap:wrap}

/* tarjeta plegable */
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s var(--ease)}
.fold>.fold-in{overflow:hidden;min-height:0}
.card.closed .fold{grid-template-rows:0fr}
.caret-b{width:28px;height:28px;border:none;background:transparent;border-radius:8px;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.caret-b:hover{background:var(--ac-soft);color:var(--ac)}
.caret-b svg{transition:transform .22s var(--ease)}
.card:not(.closed) .caret-b svg{transform:rotate(90deg)}
.pad{padding:14px 16px}
.card.closed .fold-in{visibility:hidden}

/* estudio */
.st-h{display:flex;align-items:center;gap:8px;padding:11px 14px;flex-wrap:wrap}
.st-name{flex:1 1 200px;min-width:120px;background:transparent;border:1px solid transparent;border-radius:9px;color:var(--t1);font:700 15.5px 'Outfit',system-ui,sans-serif;padding:4px 8px;transition:border-color .15s,background .15s}
.st-name:hover{border-color:var(--border)}
.st-name:focus{outline:none;border-color:var(--ac);background:var(--glass)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--t2);white-space:nowrap}
.bdg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.bdg.r3 i{background:var(--ok)}.bdg.r2 i{background:var(--warn)}.bdg.r1 i{background:var(--bad)}.bdg.r0 i{background:var(--t3)}
.st-acts{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-left:auto}
.st-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:0 14px 10px}
.st-tools .grow{flex:1}
.st-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px 12px;font-size:12px;color:var(--t3);line-height:1.5}
.st-foot .stat{color:var(--t2);font-weight:500;font-variant-numeric:tabular-nums}
.st-foot kbd,.hint kbd{font:600 10.5px 'Outfit',system-ui,sans-serif;border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--t2);background:var(--panel2)}
.gwrap{padding:0 14px}
.card.is-full{position:fixed;inset:52px 0 0 0;z-index:9000;border-radius:0;border:none;display:flex;flex-direction:column;background:var(--bg);animation:fadeIn .18s ease backwards}
.card.is-full .fold{flex:1;min-height:0;display:flex}
.card.is-full .fold-in{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.card.is-full .gwrap{flex:1;min-height:0;display:flex}
.card.is-full .gx-scroll{max-height:none;flex:1}
.card.is-full .caret-b{display:none}

/* ===== rejilla ===== */
.gx-scroll{overflow:auto;max-height:min(70vh,760px);border:1px solid var(--border);border-radius:12px;background:var(--panel);scroll-padding:46px 56px 20px 112px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;width:100%}
table.gx{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13.5px;outline:none}
.gx th{position:sticky;top:0;z-index:4;background:var(--panel2);color:var(--t2);font:600 11px/1.25 'Outfit',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:0;text-align:left;border-bottom:1px solid var(--border2);border-right:1px solid var(--border);white-space:nowrap;vertical-align:middle;user-select:none}
.gx th .th-in{display:flex;align-items:center;gap:2px;min-height:38px;padding:0 4px 0 10px;cursor:pointer}
.gx th .th-t{flex:1;min-width:0;white-space:normal;overflow-wrap:break-word;padding:8px 0}
.gx th.vh{color:var(--ac)}
.gx th .th-m{width:24px;height:24px;border:none;background:transparent;border-radius:6px;color:var(--t3);display:inline-flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .12s,background .12s}
.gx th:hover .th-m,.gx th .th-m:focus-visible{opacity:1}
.gx th .th-m:hover{background:var(--ac-soft);color:var(--ac)}
.gx th.cs{background-image:linear-gradient(var(--sel-bg),var(--sel-bg))}
.gx td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:7px 10px;vertical-align:top;min-width:112px;max-width:320px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;outline:none;cursor:cell;position:relative;background:var(--panel);line-height:1.4}
.gx td.rn,.gx th.rn{position:sticky;left:0;width:46px;min-width:46px;max-width:46px;text-align:center;padding:0}
.gx td.rn{z-index:2;background:var(--panel2);color:var(--t3);font-size:11.5px;font-weight:600;cursor:pointer;vertical-align:middle;font-variant-numeric:tabular-nums}
.gx td.rn:hover{color:var(--ac)}
.gx td.rn.rs-sel,.gx th.cs{color:var(--ac)}
.gx td.rn.rs-sel{background-image:linear-gradient(var(--sel-bg),var(--sel-bg))}
.gx th.rn{z-index:6;cursor:pointer;color:var(--t3)}
.gx td.rn .rn-n{display:block;padding:7px 0;transition:opacity .12s}
.gx td.rn .rn-m{position:absolute;inset:0;margin:auto;width:30px;height:30px;border:none;background:transparent;border-radius:7px;color:var(--ac);display:none;align-items:center;justify-content:center}
.gx td.rn.rs-act .rn-m{display:flex}
.gx td.rn.rs-act .rn-n{opacity:0}
.gx td.rn .rn-m:hover{background:var(--ac-soft)}
.gx td.k-imp{min-width:150px;font-weight:700;background-image:linear-gradient(var(--ac-soft),var(--ac-soft));vertical-align:middle;position:sticky;left:46px;z-index:1;border-right:1px solid var(--border2)}
.gx th.k-imp{left:46px;z-index:5}
@media(max-width:760px){.gx td.k-imp,.gx th.k-imp{position:static}.gx-scroll{scroll-padding-left:60px}.gx td{min-width:104px}}
.gx td.k-cm{min-width:210px;color:var(--t2)}
.gx td.k-res{min-width:140px;cursor:pointer;vertical-align:middle}
.gx td.k-name{min-width:200px;font-weight:600}
.gx td.cv{background-image:linear-gradient(var(--ac-soft),var(--ac-soft));font-weight:600}
.gx td.ro{background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--glass) 6px 7px);color:var(--t3);text-align:center;cursor:default}
.gx td.is-empty::after{content:attr(data-ph);color:var(--t3);opacity:.7;pointer-events:none}
.gx td.num{font-variant-numeric:tabular-nums}
.gx td.sel{background-image:linear-gradient(var(--sel-bg),var(--sel-bg))}
.gx td.sel{box-shadow:inset 0 var(--t,0px) 0 0 var(--ac),inset 0 var(--b,0px) 0 0 var(--ac),inset var(--l,0px) 0 0 0 var(--ac),inset var(--r,0px) 0 0 0 var(--ac)}
.gx td.e-t{--t:2px}.gx td.e-b{--b:-2px}.gx td.e-l{--l:2px}.gx td.e-r{--r:-2px}
.gx td.act{outline:2px solid var(--ac);outline-offset:-2px;z-index:3}
.gx td.editing{z-index:7}
.ge{position:absolute;top:0;left:0;width:max(100%,230px);min-height:100%;border:0;outline:2px solid var(--ac);outline-offset:-2px;background:var(--panel);color:var(--t1);font:inherit;line-height:1.4;padding:7px 10px;resize:none;overflow:hidden;z-index:8;box-shadow:var(--shadow);border-radius:2px}
.gx tr.flash td:not(.rn){animation:flash 1.1s var(--ease)}
@keyframes flash{0%{background-color:var(--ac-line)}100%{background-color:transparent}}

.rs{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;line-height:1.2}
.rs i{width:13px;height:13px;border-radius:50%;border:2px solid var(--t3);flex-shrink:0;transition:background .15s,border-color .15s,transform .15s}
.rs.r0{color:var(--t3);font-weight:500}
.rs.r1 i{background:var(--bad);border-color:var(--bad)}.rs.r1{color:var(--bad-t)}
.rs.r2 i{background:var(--warn);border-color:var(--warn)}.rs.r2{color:var(--warn-t)}
.rs.r3 i{background:var(--ok);border-color:var(--ok)}.rs.r3{color:var(--ok-t)}
td.k-res.pop .rs i{animation:popDot .3s var(--ease)}
@keyframes popDot{40%{transform:scale(1.5)}}
.gx-empty td{text-align:center;color:var(--t2);padding:22px;cursor:default;white-space:normal}

/* parametros definidos y matriz */
.pg-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.5);display:inline-block;margin-right:7px;vertical-align:-1px}
.gx.pgm td{min-width:76px;text-align:center;vertical-align:middle;padding:9px 6px}
.gx.pgm th{text-align:center}
.gx.pgm th .th-in{justify-content:center;padding:0 6px}
.gx.pgm td.rn.k-rh{width:auto;max-width:none;min-width:150px;text-align:left;padding:0 12px;font-size:12.5px;color:var(--t1)}
.pg-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pg-chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--border);border-radius:99px;padding:3px 4px 3px 11px;font-size:13px}
.view .pg-chip{animation:rowIn .2s var(--ease) both}
.pg-chip{max-width:100%;overflow-wrap:anywhere}
.pg-chip button{width:22px;height:22px;border:none;background:transparent;color:var(--t3);border-radius:50%;display:flex;align-items:center;justify-content:center}
.pg-chip button:hover{background:rgba(255,107,107,.16);color:var(--bad)}
.pg-add{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld{height:34px;background:var(--glass);border:1px solid var(--border);border-radius:9px;color:var(--t1);font:400 13.5px 'Outfit',sans-serif;padding:0 11px;outline:none;min-width:0;transition:border-color .15s}
.fld:focus{border-color:var(--ac)}

/* panel */
.dash{padding:28px var(--pad);max-width:1280px;margin:0 auto}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.dash-head h1{font:italic 400 32px/1.1 'DM Serif Display',serif;letter-spacing:-.2px}
.dash-head p{color:var(--t2);font-size:14px;margin-top:6px}
.dash-stats{display:flex;gap:10px}
.dstat{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:10px 18px;text-align:center;min-width:92px}
.dstat b{display:block;font-size:24px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.dstat span{font-size:11.5px;color:var(--t2)}
.dash-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.dash h3{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);margin:6px 0 10px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:24px}
.rcard{text-align:left;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:border-color .15s,transform .15s var(--ease),box-shadow .15s}
.rcard:hover{border-color:var(--ac-line);transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--ac)}
.rcard b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard span{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px;align-items:start}
.dcard{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:16px 18px;min-width:0}
.view .dcard{animation:viewIn .3s var(--ease) backwards}
.dcard-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dic{color:var(--ac);display:flex;align-items:center}
.dctitle{font-weight:700;font-size:15.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dproj{border-top:1px solid var(--border);padding:10px 0 4px;margin-top:6px}
.dproj-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dpname{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dtests{display:flex;flex-wrap:wrap;gap:6px}
.dtest{display:inline-flex;align-items:center;gap:6px;background:var(--ac-soft);border:1px solid transparent;color:var(--t1);border-radius:9px;padding:6px 11px;font:500 12.5px 'Outfit',system-ui,sans-serif;max-width:100%;transition:border-color .15s,background .15s}
.dtest:hover{border-color:var(--ac-line)}
.dtest span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dempty{color:var(--t3);font-size:12.5px;padding:4px 2px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--t2);padding:40px;gap:6px}
.empty .ic{color:var(--ac);margin-bottom:8px;opacity:.9}
.empty h3{color:var(--t1);font-size:19px}
.empty p{font-size:14px;max-width:380px;line-height:1.6}
.hint{font-size:12.5px;color:var(--t3);line-height:1.6}

/* menus, toasts, dialogos */
.menu{position:fixed;z-index:99990;min-width:200px;max-width:min(320px,92vw);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:5px;box-shadow:var(--shadow);animation:menuIn .14s var(--ease) both}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:none;background:transparent;border-radius:8px;font:500 13px 'Outfit',system-ui,sans-serif;text-align:left;color:var(--t1)}
.mi:hover,.mi:focus-visible{background:var(--ac-soft);outline:none}
.mi svg{width:15px;height:15px;color:var(--t2)}
.mi>span:first-of-type{min-width:0;overflow-wrap:anywhere}
.mi .hk{margin-left:auto;font-size:11px;color:var(--t3);padding-left:14px}
.mi.danger{color:var(--bad)}.mi.danger svg{color:var(--bad)}
.mi[disabled]{opacity:.4;pointer-events:none}
.mrow{display:flex;align-items:center}
.mrow .mi{flex:1;min-width:0}
.mrow .x{width:28px;height:28px;border:none;background:transparent;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t3);flex-shrink:0}
.mrow .x:hover{background:rgba(255,107,107,.16);color:var(--bad)}
.msep{height:1px;background:var(--border);margin:5px 4px}
.mhead{padding:6px 10px 3px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:94vw}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--panel2);color:var(--t1);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:13.5px;animation:toastIn .24s var(--ease) both}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast.out{animation:toastOut .2s ease both}
.toast.err{border-color:var(--bad)}
.toast button{border:none;background:transparent;color:var(--ac);font:700 13px 'Outfit',system-ui,sans-serif;padding:2px 4px}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.dlg-v{position:fixed;inset:0;z-index:99995;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(5,6,12,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fadeIn .15s both}
.dlg{width:min(440px,100%);background:var(--panel);border:1px solid var(--border2);border-radius:18px;padding:20px;box-shadow:var(--shadow);animation:menuIn .2s var(--ease) both}
.dlg h3{font-size:17px;margin-bottom:6px;overflow-wrap:anywhere}
.dlg p{color:var(--t2);font-size:14px;line-height:1.55;margin-bottom:14px;white-space:pre-line;overflow-wrap:anywhere}
.dlg .fld{width:100%;height:40px;margin-bottom:14px}
.dlg-b{display:flex;justify-content:flex-end;gap:8px}
.dlg-b .btn{height:36px}
</style>
</head>

<script>
"use strict";
/* ===== tema / shell ===== */
function themeIc(t){return t==='dark'
  ?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>'
  :'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';}
function applyTheme(t){t=(t==='light')?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('dp3-theme',t);}catch(e){}var b=document.getElementById('dpThemeBtn');if(b)b.innerHTML=themeIc(t);if(window.self!==window.top){try{window.parent.postMessage({__dp3:true,type:'theme',theme:t},'*');}catch(e){}}}
window.dpToggleTheme=function(){applyTheme((document.documentElement.getAttribute('data-theme')||'dark')==='dark'?'light':'dark');};
window.dpHome=function(){if(window.self!==window.top){try{window.parent.postMessage({__dp3:true,type:'home'},'*');}catch(e){}}else{window.location.href='../../index.html';}};
window.addEventListener('message',function(e){var d=e.data;if(d&&d.__dp3&&d.type==='theme'&&d.theme){applyTheme(d.theme);}});
(function(){var p=null;try{p=new URLSearchParams(location.search).get('dptheme');}catch(e){}var s=null;try{s=localStorage.getItem('dp3-theme');}catch(e){}applyTheme(p||s||'dark');})();
function toggleSide(forceClose){ if(forceClose===true)document.body.classList.add('side-off'); else document.body.classList.toggle('side-off'); }
if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)document.body.classList.add('side-off');
function isMobile(){ return window.matchMedia&&window.matchMedia('(max-width:760px)').matches; }

/* ===== iconos ===== */

function I(n,s){ s=s||16; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[n]||'')+'</svg>'; }
function caret(op){ return '<span class="tcaret'+(op?' op':'')+'">'+I('chev',12)+'</span>'; }

/* ===== utilidades ===== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fold(s){ try{ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }catch(e){ return String(s||'').toLowerCase().trim(); } }
function num(s){ var t=String(s==null?'':s).trim().replace(/\s/g,''); if(t==='')return NaN; t=t.replace(',','.'); return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)?parseFloat(t):NaN; }

function normTest(t){
  function isO(x){ return !!x&&typeof x==='object'; }
  if(!Array.isArray(t.params))t.params=[];
  t.params=t.params.filter(isO); t.params.forEach(function(p){ if(!p.id)p.id=uid(); if(typeof p.name!=='string')p.name=String(p.name==null?'':p.name); if(typeof p.val!=='string')p.val=String(p.val==null?'':p.val); });

  delete t.cols; delete t.studies;
  t.estudios=t.estudios.filter(isO);
  t.estudios.forEach(function(est){
    if(!est.id)est.id=uid();
    if(typeof est.name!=='string')est.name=(est.name==null?'Estudio':String(est.name));
    if(!Array.isArray(est.cols))est.cols=[];
    est.cols=est.cols.filter(isO); est.cols.forEach(function(c){ if(!c.id)c.id=uid(); if(typeof c.name!=='string')c.name=String(c.name==null?'':c.name); });
    if(!Array.isArray(est.imps))est.imps=(Array.isArray(est.studies)?est.studies:[]);
    delete est.studies;
    est.imps=est.imps.filter(isO);
    est.imps.forEach(function(imp){
      if(!imp.id)imp.id=uid();
      if(typeof imp.name!=='string')imp.name=(imp.name==null?'Impresión':String(imp.name));
      if(!Array.isArray(imp.prints)){ if(!imp.vals||typeof imp.vals!=='object')imp.vals={}; imp.prints=[{id:uid(),ident:(imp.ident||''),result:(typeof imp.result==='number'?imp.result:0),vals:imp.vals,comment:(imp.comment||'')}]; delete imp.ident; delete imp.vals; delete imp.result; }
      imp.prints=imp.prints.filter(isO); imp.prints.forEach(function(pr){ if(!pr.id)pr.id=uid(); if(typeof pr.result==='string'&&/^\s*[0-3]\s*$/.test(pr.result))pr.result=+pr.result; if(typeof pr.result==='number')pr.result=Math.round(pr.result); if(typeof pr.ident!=='string')pr.ident=(pr.ident==null?'':String(pr.ident)); if(!pr.vals||typeof pr.vals!=='object')pr.vals={}; if(typeof pr.result!=='number'||pr.result<0||pr.result>3)pr.result=0; if(typeof pr.comment!=='string')pr.comment=(pr.comment==null?'':String(pr.comment));

    });
  });
}

var H={u:[],r:[]};

function pushUndo(){ var s=snapData(); if(H.u.length&&H.u[H.u.length-1]===s)return; H.u.push(s); if(H.u.length>80)H.u.shift(); H.r=[]; updUndo(); }
function updUndo(){ var u=document.getElementById('undoBtn'),r=document.getElementById('redoBtn'); if(u)u.disabled=!H.u.length; if(r)r.disabled=!H.r.length; }
function restoreSnap(s){ var d=JSON.parse(s); S.mods=d.mods||[]; S.paramPresets=d.paramPresets||[]; S.colPresets=d.colPresets||[]; S.purge=d.purge||{colors:[],grid:{}}; norm(); if(S.sel.t&&!curTest()){ S.sel.t=null; } if(S.sel.p&&!curProj()){ S.sel.p=null; S.sel.t=null; } if(S.sel.m&&!curMod()){ S.sel.m=null; } }

function toast(msg,opt){
  opt=opt||{}; var wrap=document.getElementById('toasts'); if(!wrap)return;
  while(wrap.children.length>=3)wrap.firstChild.remove();
  var t=document.createElement('div'); t.className='toast'+(opt.err?' err':''); var sp=document.createElement('span'); sp.textContent=msg; t.appendChild(sp);
  var tm=null; function close(){ clearTimeout(tm); if(!t.parentNode)return; t.classList.add('out'); setTimeout(function(){ t.remove(); },200); }
  if(opt.action){ var b=document.createElement('button'); b.textContent=opt.action.label; b.onclick=function(){ close(); opt.action.fn(); }; t.appendChild(b); }
  wrap.appendChild(t); tm=setTimeout(close,opt.ms||(opt.action?6000:2600));
}
function dlg(o){
  return new Promise(function(resolve){
    var prev=document.activeElement;
    var v=document.createElement('div'); v.className='dlg-v';
    var h='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">'+esc(o.title||'')+'</h3>';
    if(o.msg)h+='<p>'+esc(o.msg)+'</p>';
    if(o.input)h+='<input class="fld" id="dlgIn" type="text" autocomplete="off" placeholder="'+esc(o.ph||'')+'" aria-label="'+esc(o.title||'')+'">';
    h+='<div class="dlg-b">'+(o.noCancel?'':'<button class="btn" data-r="0">Cancelar</button>')+'<button class="btn '+(o.danger?'danger':'solid')+'" data-r="1" id="dlgOk">'+esc(o.ok||'Aceptar')+'</button></div></div>';
    v.innerHTML=h; document.body.appendChild(v);
    var inp=v.querySelector('#dlgIn'); if(inp){ inp.value=o.value||''; }
    function done(ok){ document.removeEventListener('keydown',kd,true); v.remove(); try{ if(prev&&prev.focus)prev.focus(); }catch(e){} resolve(ok?(o.input?inp.value:true):(o.input?null:false)); }
    function kd(e){
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(false); }
      else if(e.key==='Enter'&&!(e.target&&e.target.tagName==='BUTTON')){ e.preventDefault(); e.stopPropagation(); done(true); }
      else if(e.key==='Tab'){ var f=[].slice.call(v.querySelectorAll('input,button')); if(!f.length)return; var i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey&&i===f.length-1){ e.preventDefault(); f[0].focus(); } }
    }
    document.addEventListener('keydown',kd,true);
    [].forEach.call(v.querySelectorAll('button[data-r]'),function(b){ b.onclick=function(){ done(b.getAttribute('data-r')==='1'); }; });
    v.addEventListener('mousedown',function(e){ if(e.target===v)done(false); });
    setTimeout(function(){ if(inp){ inp.focus(); inp.select(); } else { var ok=v.querySelector('#dlgOk'); if(ok)ok.focus(); } },30);
  });
}

  function kd(e){

    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeMenu(); }

var saveT=null, myTs=0, loaded=false, dirty=false;
function setSave(st){ var c=document.getElementById('saveChip'); if(!c)return; var tx={saved:'Guardado',saving:'Guardando…',off:'Sin sesión: no se guarda',err:'Error al guardar',load:'Cargando…'}[st]||''; c.className='save '+st; c.querySelector('b').textContent=tx; c.title=st==='off'?'Inicia sesión en 3DProject para guardar tus cambios':tx; }

function cloudPush(){
  clearTimeout(saveT); saveT=null; if(!dirty)return;
  try{
    var C=window.DPCloud;
    if(C&&C.configured){
      var u=C.currentUser&&C.currentUser();
      if(u){ myTs=Date.now(); dirty=false; Promise.resolve(C.saveState('3dlab',S,myTs)).then(function(){ if(!dirty)setSave('saved'); }).catch(function(e){ dirty=true; setSave('err'); console.warn('[3DLab] guardado en nube falló:',e&&(e.message||e)); clearTimeout(saveT); saveT=setTimeout(cloudPush,8000); }); return; }

    }

  setSave('off');
}

<script>
"use strict";
/* ============================================================

   ============================================================ */
var GR={};            // id de rejilla -> esquema
var GSEL=null;        // {g, ar,ac, fr,fc}
var GE=null;          // edición en curso
var gDrag=null;       // arrastre de selección

var PEND=null;        // celda a seleccionar tras repintar
var pendingRemote=null;

function tblOf(g){ return document.querySelector('table.gx[data-g="'+g+'"]'); }
function cellMap(g){ var s=GR[g]; if(!s)return null; var t=tblOf(g); if(!t)return null; if(s._m&&s._mt===t)return s._m; var m={}; [].forEach.call(t.querySelectorAll('tbody td[data-r][data-c]'),function(td){ m[td.getAttribute('data-r')+','+td.getAttribute('data-c')]=td; }); s._m=m; s._mt=t; return m; }
function tdAt(g,r,c){ var m=cellMap(g); if(!m)return null; var td=m[r+','+c]; if(td)return td; var s=GR[g]; if(s&&s.span){ var sp=s.span(r,c); if(sp&&sp[0]!==r)return m[sp[0]+','+c]||null; } return null; }
function rngOf(){ if(!GSEL)return null; return {g:GSEL.g,r0:Math.min(GSEL.ar,GSEL.fr),r1:Math.max(GSEL.ar,GSEL.fr),c0:Math.min(GSEL.ac,GSEL.fc),c1:Math.max(GSEL.ac,GSEL.fc)}; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function startRow(s,r,c){ var sp=s.span&&s.span(r,c); return sp?sp[0]:r; }
/* Celda siguiente/anterior con Tab (salta las celdas cubiertas por una combinada); null en los extremos. */
function tabStep(s,r,c,back){ var nr=s.nRows(),nc=s.nCols();
  for(var guard=0;guard<nr*nc+2;guard++){
    c+=back?-1:1; if(c>=nc){ c=0; r++; } else if(c<0){ c=nc-1; r--; }
    if(r<0||r>=nr)return null;
    if(startRow(s,r,c)===r)return {r:r,c:c}; }
  return null; }

function setSel(g,ar,ac,fr,fc,o){
  o=o||{}; var s=GR[g]; if(!s||!s.nRows()||!s.nCols()){ GSEL=null; paint(); return; }
  var nr=s.nRows(),nc=s.nCols();
  ar=clamp(ar,0,nr-1); ac=clamp(ac,0,nc-1); fr=clamp(fr==null?ar:fr,0,nr-1); fc=clamp(fc==null?ac:fc,0,nc-1);
  if(ar===fr&&ac===fc){ ar=fr=startRow(s,ar,ac); }
  GSEL={g:g,ar:ar,ac:ac,fr:fr,fc:fc};
  paint(o.focus!==false);
  if(o.scroll!==false){ var td=tdAt(g,fr,fc); if(td)scrollIntoGrid(td); }
}
function scrollIntoGrid(td){
  var sc=td.closest('.gx-scroll'); if(!sc)return;
  var cr=sc.getBoundingClientRect(), r=td.getBoundingClientRect();
  var th=sc.querySelector('thead th'); var hh=th?th.getBoundingClientRect().height:40;
  var stickyL=0; var rn=sc.querySelector('td.rn'); if(rn)stickyL+=rn.getBoundingClientRect().width;
  var imp=sc.querySelector('td.k-imp'); if(imp&&getComputedStyle(imp).position==='sticky'&&!td.classList.contains('k-imp')&&!td.classList.contains('rn'))stickyL+=imp.getBoundingClientRect().width;
  if(r.left<cr.left+stickyL)sc.scrollLeft-=(cr.left+stickyL-r.left)+6;
  else if(r.right>cr.right)sc.scrollLeft+=(r.right-cr.right)+6;
  if(r.top<cr.top+hh)sc.scrollTop-=(cr.top+hh-r.top)+4;
  else if(r.bottom>cr.bottom)sc.scrollTop+=(r.bottom-cr.bottom)+4;
}
function paint(focus){
  [].forEach.call(document.querySelectorAll('.gx td.sel,.gx td.act'),function(td){ td.classList.remove('sel','act','e-t','e-b','e-l','e-r'); td.removeAttribute('aria-selected'); });
  [].forEach.call(document.querySelectorAll('.gx th.cs,.gx td.rs-sel,.gx td.rs-act'),function(x){ x.classList.remove('cs','rs-sel','rs-act'); });
  [].forEach.call(document.querySelectorAll('.gx td[tabindex="0"]'),function(x){ x.tabIndex=-1; });
  // un solo punto de entrada con Tab por rejilla
  [].forEach.call(document.querySelectorAll('table.gx'),function(t){ if(GSEL&&GSEL.g===t.getAttribute('data-g'))return; var f=t.querySelector('td[data-r][data-c]'); if(f)f.tabIndex=0; });
  if(!GSEL){ updStats(); return; }
  var s=GR[GSEL.g],t=tblOf(GSEL.g); if(!s||!t){ updStats(); return; }
  var R=rngOf(),multi=!(R.r0===R.r1&&R.c0===R.c1),seen=[];
  for(var r=R.r0;r<=R.r1;r++)for(var c=R.c0;c<=R.c1;c++){
    var td=tdAt(GSEL.g,r,c); if(!td||seen.indexOf(td)>=0)continue; seen.push(td);
    var tr=+td.getAttribute('data-r'),tc=+td.getAttribute('data-c'),sp=(s.span&&s.span(tr,tc))||[tr,tr];
    if(multi){ td.classList.add('sel'); td.setAttribute('aria-selected','true'); if(sp[0]<=R.r0)td.classList.add('e-t'); if(sp[1]>=R.r1)td.classList.add('e-b'); if(tc===R.c0)td.classList.add('e-l'); if(tc===R.c1)td.classList.add('e-r'); }
  }
  var act=tdAt(GSEL.g,GSEL.ar,GSEL.ac);
  if(act){ var arn=t.querySelector('tbody td.rn[data-r="'+GSEL.ar+'"]'); if(arn)arn.classList.add('rs-act'); act.classList.add('act'); act.tabIndex=0; act.setAttribute('aria-selected','true'); if(focus&&!GE){ try{ act.focus({preventScroll:true}); }catch(e){ act.focus(); } } }
  for(var cc=R.c0;cc<=R.c1;cc++){ var th=t.querySelector('thead th[data-c="'+cc+'"]'); if(th)th.classList.add('cs'); }
  for(var rr=R.r0;rr<=R.r1;rr++){ var h=t.querySelector('tbody td.rn[data-r="'+rr+'"]'); if(h)h.classList.add('rs-sel'); }

}
function updStats(){
  [].forEach.call(document.querySelectorAll('[data-stat]'),function(el){ el.textContent=''; });
  if(!GSEL)return; var el=document.querySelector('[data-stat="'+GSEL.g+'"]'); var s=GR[GSEL.g]; if(!el||!s)return;
  var R=rngOf(),n=0,sum=0,mn=Infinity,mx=-Infinity;
  if(!(R.r0===R.r1&&R.c0===R.c1)){
    for(var r=R.r0;r<=R.r1;r++)for(var c=R.c0;c<=R.c1;c++){ var v=num(s.get(r,c)); if(!isNaN(v)){ n++; sum+=v; if(v<mn)mn=v; if(v>mx)mx=v; } }
    var txt=(R.r1-R.r0+1)+' filas × '+(R.c1-R.c0+1)+' columnas';
    if(n>1)txt+=' · Suma '+fmtNum(sum)+' · Media '+fmtNum(sum/n)+' · Mín '+fmtNum(mn)+' · Máx '+fmtNum(mx);
    el.textContent=txt;
  }
}
function syncCell(g,r,c){
  var s=GR[g]; if(!s)return; var td=tdAt(g,r,c); if(!td)return; if(td.querySelector('.ge'))return;
  var v=s.get(r,c); td.innerHTML=s.html?s.html(r,c):esc(v);
  td.classList.toggle('is-empty',String(v)===''&&s.type(r,c)!=='res');
}

/* ----- edición ----- */
function startEdit(g,r,c,initial){
  var s=GR[g]; if(!s||!s.editable(r,c)||s.type(r,c)==='res')return false;
  if(GE)endEdit(true);

  td.classList.add('editing'); td.appendChild(ta);
  GE={g:g,r:r,c:c,ta:ta,td:td,orig:s.get(r,c)};
  function grow(){ ta.style.height='auto'; ta.style.height=Math.max(ta.scrollHeight,td.offsetHeight)+'px'; }
  ta.addEventListener('input',grow); ta.addEventListener('blur',function(){ if(GE&&GE.ta===ta)endEdit(true); });
  grow(); ta.focus({preventScroll:true}); try{ ta.setSelectionRange(ta.value.length,ta.value.length); }catch(e){}

}
function endEdit(commit){
  if(!GE)return; var e=GE; GE=null;
  var v=e.ta.value; e.td.classList.remove('editing'); e.ta.remove();
  var s=GR[e.g];

}

/* ----- navegación ----- */
function moveSel(dr,dc,extend){
  if(!GSEL)return; var s=GR[GSEL.g]; if(!s)return;
  var nr=s.nRows(),nc=s.nCols(); var r=extend?GSEL.fr:GSEL.ar,c=extend?GSEL.fc:GSEL.ac;
  if(dr&&!extend&&s.span){ var sp=s.span(r,c); if(sp&&sp[0]!==sp[1]){ r=dr>0?sp[1]:sp[0]; } }
  var nr2=clamp(r+dr,0,nr-1),nc2=clamp(c+dc,0,nc-1);
  if(!extend&&dr&&s.span){ var sp2=s.span(nr2,nc2); if(sp2)nr2=sp2[0]; }
  if(extend)setSel(GSEL.g,GSEL.ar,GSEL.ac,nr2,nc2); else setSel(GSEL.g,nr2,nc2,nr2,nc2);
}
function gridKey(e){
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
  var td=e.target.closest&&e.target.closest('td[data-r]'); if(!td)return;
  var table=td.closest('table.gx'); var g=table.getAttribute('data-g'),s=GR[g]; if(!s)return;
  if(!GSEL||GSEL.g!==g)setSel(g,+td.getAttribute('data-r'),+td.getAttribute('data-c'),null,null,{focus:false});
  if(!GSEL)return;
  var mod=e.ctrlKey||e.metaKey,k=e.key,nr=s.nRows(),nc=s.nCols();
  var rr=GSEL.ar,cc=GSEL.ac;
  if(k==='ArrowDown'||k==='ArrowUp'||k==='ArrowLeft'||k==='ArrowRight'){
    e.preventDefault(); ENTER_COL=null;
    var dr=k==='ArrowDown'?1:k==='ArrowUp'?-1:0,dc=k==='ArrowRight'?1:k==='ArrowLeft'?-1:0;
    if(mod){ var f=e.shiftKey?{r:GSEL.fr,c:GSEL.fc}:{r:rr,c:cc}; var tr=dr>0?nr-1:dr<0?0:f.r,tc=dc>0?nc-1:dc<0?0:f.c; if(e.shiftKey)setSel(g,GSEL.ar,GSEL.ac,tr,tc); else setSel(g,tr,tc); }
    else moveSel(dr,dc,e.shiftKey);
  }

    if(!nx)return;   // en los extremos Tab sale de la tabla: sin trampa de teclado
    e.preventDefault(); if(ENTER_COL==null)ENTER_COL=cc;
    setSel(g,nx.r,nx.c);
  }
  else if(k==='Enter'){
    e.preventDefault(); var col=ENTER_COL!=null?ENTER_COL:cc; ENTER_COL=null;
    var d=e.shiftKey?-1:1, rn=clamp(d>0?(s.span?(s.span(rr,col)||[rr,rr])[1]:rr)+1:rr-1,0,nr-1);

  else if(k==='Home'){ e.preventDefault(); if(mod)setSel(g,0,0,e.shiftKey?0:null,e.shiftKey?0:null); else if(e.shiftKey)setSel(g,GSEL.ar,GSEL.ac,GSEL.fr,0); else setSel(g,rr,0); }
  else if(k==='End'){ e.preventDefault(); if(mod)setSel(g,nr-1,nc-1); else if(e.shiftKey)setSel(g,GSEL.ar,GSEL.ac,GSEL.fr,nc-1); else setSel(g,rr,nc-1); }
  else if(k==='PageDown'||k==='PageUp'){ e.preventDefault(); var sc=table.closest('.gx-scroll'),rh=td.offsetHeight||30,step=Math.max(1,Math.floor((sc.clientHeight-60)/rh)); var d2=k==='PageDown'?step:-step; if(e.shiftKey)setSel(g,GSEL.ar,GSEL.ac,clamp(GSEL.fr+d2,0,nr-1),GSEL.fc); else setSel(g,clamp(rr+d2,0,nr-1),cc); }

  function render(){

    h+='<div class="dph-hd"><span class="dph-ic" style="background:'+(C.accent||'#5b8cff')+'">'+HDIC+'</span><div><div class="dph-ti">'+h2(C.title)+'</div><div class="dph-tg">'+h2(C.tagline||'')+'</div></div><button class="dph-x" aria-label="Cerrar" title="Cerrar">&times;</button></div><div class="dph-bd">';
    (C.sections||[]).forEach(function(s){
      h+='<div class="dph-sec"><div class="dph-h">'+h2(s.h)+'</div>';
      if(s.p) h+='<p class="dph-p">'+h2(s.p)+'</p>';
      if(s.steps){ h+='<ol>'; s.steps.forEach(function(x){ h+='<li>'+h2(x)+'</li>'; }); h+='</ol>'; }
      if(s.list){ h+='<ul>'; s.list.forEach(function(x){ h+='<li>'+h2(x)+'</li>'; }); h+='</ul>'; }
      if(s.defs){ s.defs.forEach(function(d){ h+='<div class="dph-def"><b>'+h2(d[0])+'</b><span>'+h2(d[1])+'</span></div>'; }); }
      h+='</div>';
    });
    return h+'</div></div>';
  }
  var veil=null;
  function ensure(){ if(veil) return; var st=document.createElement('style'); st.textContent=CSS; document.head.appendChild(st); veil=document.createElement('div'); veil.className='dph-veil'; veil.addEventListener('click',function(e){ if(e.target===veil) close(); }); document.body.appendChild(veil); document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); }); }
  var back=null;
  function open(){ back=document.activeElement; ensure(); veil.innerHTML=render(); var x=veil.querySelector('.dph-x'); if(x){ x.addEventListener('click',close); x.focus(); } veil.classList.add('open'); }
  function close(){ if(!veil||!veil.classList.contains('open'))return; veil.classList.remove('open'); if(back&&back.focus&&document.contains(back)){ try{ back.focus(); }catch(e){} } back=null; }
  window.DPHelp={open:open,close:close};
})();
</script>
</body>
</html>
